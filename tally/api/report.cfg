[
{
    "name": "brokerage",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature":"admin",
    "comment":"查询指定帐号的佣金",

    "request": [
        {"name":"owner", "type":"string", "must":true, "min":1, "comment":"所有人帐号"},
        {"name":"from", "type":"int", "must":true, "min":0, "comment":"开始时间(包括)，UTC分钟"},
        {"name":"to", "type":"int", "must":true, "min":0, "comment":"结束时间(包括)，UTC分钟"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"开始行号"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"返回行数"}
    ],

    "vars": [
        {"name":"start", "val":"@{SUB|i,from,1}"},
        {"name":"end", "val":"@{ADD|i,to,1}"}
    ],

    "process" : [
        {
            "name" : "data",
            "type" : "rdb",
            "db":"member",
            "sqls": [
                {
                    "name":"list",
                    "metas":"cols",
                    "multi":true,
                    "sql":"select did,type,ratio,brokerage,createAt,owner
                         from brokerages
                        where owner='@{owner}'
                          and createAt>@{start} and createAt<@{end}
                       order by createAt desc
                       LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"total",
                    "metas":"each",
                    "multi":false,
                    "merge":true,
                    "sql":"select count(*) total from brokerages
                        where owner='@{owner}'
                          and createAt>@{start} and createAt<@{end}"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，did:sequence id；type:类型：ORD订单，SRV服务；ratio:提成比率；brokerage:客服创建订单获得提成，或员工提供服务获得提成；createAt:创建时间，UTC分钟；owner:帐号"},
            {"name":"total", "type":"int", "comment":"总充值额"}
        ]
    }
},
{
    "name": "brokerages",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature":"admin",
    "comment":"佣金按owner汇总查询",
            
    "request": [
        {"name":"from", "type":"int", "must":true, "min":0, "comment":"开始时间(包括)，UTC分钟"},
        {"name":"to", "type":"int", "must":true, "min":0, "comment":"结束时间(包括)，UTC分钟"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"开始行号"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"返回行数"}
    ],

    "vars": [
        {"name":"start", "val":"@{SUB|i,from,1}"},
        {"name":"end", "val":"@{ADD|i,to,1}"}
    ],

    "process" : [
        {
            "name" : "data",
            "type" : "rdb",
            "db":"member",
            "sqls": [
                {
                    "name":"list",
                    "metas":"cols",
                    "multi":true,
                    "sql":"select ifnull(sum(brokerage),0) brokerage,owner
                         from brokerages
                        where createAt>@{start} and createAt<@{end}
                       group by owner
                       order by owner desc
                       LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"total",
                    "metas":"each",
                    "multi":false,
                    "merge":true,
                    "sql":"select count(DISTINCT owner) total
                        from brokerages
                       where createAt>@{start} and createAt<@{end}"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，brokerage:客服创建订单获得提成，或员工提供服务获得提成；owner:帐号"},
            {"name":"total", "type":"int", "comment":"总充值额"}
        ]
    }
},
{
    "name": "myBrokerage",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"我的佣金查询",

    "request": [
        {"name":"from", "type":"int", "must":true, "min":0, "comment":"开始时间(包括)，UTC分钟"},
        {"name":"to", "type":"int", "must":true, "min":0, "comment":"结束时间(包括)，UTC"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"开始行号"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"返回行数"}
    ],

    "vars": [
        {"name":"start", "val":"@{SUB|i,from,1}"},
        {"name":"end", "val":"@{ADD|i,to,1}"}
    ],

    "process" : [
        {
            "name" : "data",
            "type" : "rdb",
            "db":"member",
            "sqls": [
                {
                    "name":"list",
                    "metas":"cols",
                    "multi":true,
                    "sql":"select did,type,ratio,brokerage,createAt
                         from brokerages
                       where createAt>@{start} and createAt<@{end}
                         and owner='@{#tokenAcc}'
                        order by createAt desc
                       LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"total",
                    "metas":"each",
                    "multi":false,
                    "merge":true,
                    "sql":"select count(*) total,ifnull(sum(brokerage),0) brokerage
                         from brokerages
                       where createAt>@{start} and createAt<@{end}
                         and owner='@{#tokenAcc}'"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，did:sequence id；type:类型：ORD订单，SRV服务；ratio:提成比率；brokerage:客服创建订单获得提成，或员工提供服务获得提成；createAt:创建时间，UTC分钟"},
            {"name":"total", "type":"int", "comment":"充值总次数"},
            {"name":"brokerage", "type":"double", "comment":"客服创建订单获得提成，或员工提供服务获得提成"}
        ]
    }
},
{
    "name":"stats",
    "method":"GET",
    "property":"private",
    "tokenChecker":"USER",
    "aclChecker":"RBAC",
    "feature":"admin",

    "request": [
        {"name":"from", "type":"int", "must":true, "min":0, "comment":"开始时间(包括)，UTC小时"},
        {"name":"to", "type":"int", "must":true, "min":0, "comment":"结束时间(包括)，UTC小时"}
    ],

    "process" : [
        {
            "name" : "data",
            "type" : "rdb",
            "db":"member",
            "sqls": [
                {
                    "name":"data",
                    "metas":"cols",
                    "multi":true,
                    "sql":"select at,vip,nOrder,vOrder,nService,vService,brokerage
                       from reports
                       where at>@{SUB|i,from,1} and at<@{ADD|i,to,1}
                       order by at asc"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"data", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，at:创建时间，以UTC小时为单位；vip:新增会员数量；nOrder:新增订单数量；vOrder:新增订单金额；nService:新增消费次数；vService:新增消费金额；brokerage:佣金"}
        ]
    }
}
]