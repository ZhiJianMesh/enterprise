[
{
    "name": "create",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"创建订单，任何角色都可以创建，但是只有admin可以确认",

    "request": [
        {"name":"vip", "type":"int",  "must":true, "min":0, "comment":"会员id"},
        {"name":"val", "type":"float", "must":true, "min":0, "comment":"订单金额"},
        {"name":"bankAcc", "type":"string", "must":false, "default":"", "max":255},
        {"name":"cmt", "type":"string", "must":true, "min":1, "comment":"描述"}
    ],

    "vars":[
        {"name":"orderId", "val":"@{SEQUENCE|i,'orderid'}"}
    ],

    "process" : [{
        "name" : "createOrder",
        "type" : "rdb",
        "db": "member",
        "sqls" : [
            "insert into orders(id,vip,creator,createAt,val,bankAcc,cmt) 
             values(@{orderId},@{vip},'@{#tokenAcc}',@{NOW|unit60000},
             @{val},'@{bankAcc}','@{cmt}')"
        ]
    }],
    "response":[]
},

{
    "name": "confirm",
    "method":"PUT",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature": "admin",
    "comment":"确认订单",

    "request": [
        {"name":"id", "type":"int",  "must":true, "min":0, "comment":"订单id"}
    ],

    "process" : [
        {
            "name" : "get_order_info",
            "type" : "rdb",
            "db": "member",
            "sqls" : [{
                "name":"order_info",
                "metas":"each",
                "multi":false,
                "merge":true,
                "sql":"select vip,val,state,creator from orders where id=@{id}"
            }],
            "onSuccess" : {
                "condition":"@{CONDITION|!state,'s.==','WAIT'}",
                "errorCode":30002,
                "errorInfo":"invalid order"
            }
        },
        {
            "name":"get_ratio_from_config",
            "type":"call",
            "service":"config",
            "method":"GET",
            "tokenSign":"APP",
            "cache":"order_ratio",
            "url":"/getWithDefault?k=order_ratio&as=ratio&v=0.05",
            "onSuccess":"{
                \"brokerage\":@{MULTI|d,!ratio,!val},
                \"at\":@{NOW|unit3600000}
            }"
        },
        {
            "name" : "confirm_order",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                "update vips set balance=balance+@{!val},total=total+@{!val}
                 where id=@{!vip}",
                
                "update orders set state='OK' where id=@{id}",

                "insert or ignore into reports(at) values(@{!at})",

                "update reports set
                    nOrder=nOrder+1,
                    vOrder=vOrder+@{!val},
                    brokerage=brokerage+@{!brokerage}
                 where at=@{!at}",

                "insert into brokerages(did,type,ratio,brokerage,createAt,owner)
                 values(@{id},'ORD',@{!ratio},@{!brokerage},@{NOW|unit60000},'@{!creator}')"
            ]
        }
    ],
    "response":[]
},

{
    "name": "remove",
    "method":"DELETE",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature": "write",
    "comment":"删除订单信息，只有admin可以删除已确定的订单，创建者可以删除未确定的订单",

    "request": [
        {"name":"id", "type":"int", "must":true, "min":0, "comment":"订单id"},
        {"name":"refund", "type":"float", "must":true, "min":0, "comment":"退款额"}
    ],

    "process" : [
        {
            "name":"update_reports",
            "type":"rdb",
            "db":"member",
            "sqls" : [
                {
                    "name":"order_info",
                    "metas":"each",
                    "multi":false,
                    "merge":true,
                    "sql":"select val,state,vip from orders where id=@{id}"
                },
                {
                    "when":"@[CONDITION|!state, 's.==', 'OK']", //未确认订单，未产生报表
                    "name":"brokerage_info",
                    "metas" : "each",
                    "multi":false,
                    "merge":true,
                    "sql":"select brokerage oldBrokerage,createAt
                         from brokerages where did=@{id} and type='ORD'"
                },

                {
                    //未确认的订单，没有调整会员余额
                    "when":"@[CONDITION|!state,'s.==','OK']",
                    "sql":"delete from brokerages where did=@{id} and type='ORD';
                        
                        update reports set
                          brokerage=brokerage-@[!oldBrokerage],
                          vOrder=vOrder-@{refund},
                          nOrder=nOrder-1
                         where at=@[!createAt];

                        update vips set total=total-@[!val],balance=balance-@[!val] where id=@[!vip]"
                },

                "delete from orders where id=@{id}" //remove order
            ]
        }
    ],
    
    "response":[]
},

{
    "name": "list",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature":"read",
    "comment":"列举某个会员的订单信息",

    "request": [
        {"name":"vip", "type":"int", "must":true, "min":0, "comment":"成员id"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"查询起始行"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"返回记录数"}
    ],

    "process" : [
        {
            "name" : "orders",
            "type" : "rdb",
            "db": "member",
            "sqls" : [{
                 "name": "list",
                 "multi":true,
                 "metas":"cols",
                 "sql":"select id,createAt,val,state,creator,bankAcc,cmt
                  from orders where vip=@{vip}
                   order by createAt desc
                  LIMIT @{num} OFFSET @{offset}"
            }]
        },
        
        {
            "name" : "stat",
            "type" : "rdb",
            "db": "member",
            "sqls" : [{
                 "name": "stat",
                 "multi":false,
                 "metas" : "each",
                 "merge":true,
                 "sql":"select count(*) as total,ifnull(sum(val),0) val from orders where vip=@{vip}"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，id:sequence id；createAt:创建时间，UTC分钟；val:金额；state:状态：WAIT待确认，OK已确认；creator:创建人帐号；bankAcc:银行、支付宝、微信支付等帐号；cmt:备注"},
            {"name":"total", "type":"int", "comment":"总充值额"},
            {"name":"val", "type":"double", "comment":"金额"}
        ]
    }
},

{
    "name": "my",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"我创建的订单信息",

    "request": [
        {"name":"state", "type":"string", "must":true, "options":["OK","WAIT","ALL"]},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"查询起始行"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"返回记录数"}
    ],

    "vars": [
        {"name":"end", "val":"@{NOW|unit60000}"}, //分钟
        {"name":"start", "val":"@{SUB|i,end,43200}"} //30天
    ],

    "process" : [
        {
            "name" : "my_list",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                {
                     "name": "list",
                     "multi":true,
                     "metas":"cols",
                     "sql":"select o.id,o.vip,o.createAt,o.creator,o.val,o.update_time updTime,o.state,
                            v.name,v.code
                          from orders o,vips v
                         where o.creator='@{#tokenAcc}'
                           @{CONDITION|state,'s.==','ALL',``,`and o.state='@{state}'`}
                           and v.id=o.vip
                       order by o.createAt desc
                      LIMIT @{num} OFFSET @{offset}"
                },
                {
                     "name":"total",
                     "multi":false,
                     "metas":"each",
                     "merge":true,
                     "sql":"select count(*) total from orders
                         where creator='@{#tokenAcc}'
                           @{CONDITION|state,'s.==','ALL',``,`and state='@{state}'`}"
                },
                {
                    "name":"month_score",
                    "multi":false,
                    "metas":"each",
                    "merge":true,
                    "sql":"select ifnull(sum(val),0) vOrder,count(*) nOrder from orders
                        where creator='@{#tokenAcc}'
                          and createAt>@{start}-1 and createAt<@{end}+1
                          @{CONDITION|state,'s.==','ALL',``,`and state='@{state}'`}"
                },
                {
                    "name":"month_brokerage",
                    "multi":false,
                    "metas":"each",
                    "merge":true,
                    "sql":"select ifnull(sum(brokerage),0) vBrokerage from brokerages
                        where createAt>@{start}-1 and createAt<@{end}+1
                          and owner='@{#tokenAcc}' and type='ORD'"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，id:sequence id；vip:会员id；createAt:创建时间，UTC分钟；creator:创建人帐号；val:金额；updTime；state:状态：WAIT待确认，OK已确认；name:姓名或昵称；code:编码，比如游戏ID"},
            {"name":"total", "type":"int", "comment":"总充值额"},
            {"name":"vOrder", "type":"float", "comment":"新增订单金额"},
            {"name":"nOrder", "type":"int", "comment":"新增订单数量"},
            {"name":"vBrokerage", "type":"float", "comment":"提成"}
        ]
    }
},

{
    "name": "get",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RoAAC",
    "feature":"read",
    "comment":"查看订单详细信息，超级管理员或创建者可调用",

    "request": [
        {"name":"id", "type":"int", "must":true, "min":0, "comment":"订单id"}
    ],

    "aclProcess" : [{
        "name":"check_right",
        "type":"dataexists",
        "expect":true,
        "db": "member",
        "sql":"select 1 from orders where id=@{id} and creator='@{#tokenAcc}'"
    }],

    "process" : [{
        "name":"get_detail",
        "type":"rdb",
        "db":"member",
        "sqls": [{
             "name":"detail",
             "metas":"each",
             "merge":true,
             "multi":false,
             "sql":"select o.createAt,o.creator,o.state,o.cmt,o.val,o.bankAcc,
                v.name,v.code,v.total,v.balance
              from orders o,vips v
               where o.id=@{id} and v.id=o.vip"
        }]
    }],
    "response":{
        "check":false,
        "segments":[
            {"name":"createAt", "type":"int", "comment":"创建时间，UTC分钟"},
            {"name":"creator", "type":"string", "comment":"创建人帐号"},
            {"name":"state", "type":"string", "comment":"状态：WAIT待确认，OK已确认"},
            {"name":"cmt", "type":"string", "comment":"备注"},
            {"name":"val", "type":"double", "comment":"金额"},
            {"name":"bankAcc", "type":"string", "comment":"银行、支付宝、微信支付等帐号"},
            {"name":"name", "type":"string", "comment":"姓名或昵称"},
            {"name":"code", "type":"string", "comment":"编码，比如游戏ID"},
            {"name":"total", "type":"double", "comment":"总充值额"},
            {"name":"balance", "type":"double", "comment":"余额，每次充值或消费都会改变这个值"}
        ]
    }
},
{
    "name": "listAll",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature": "admin",
    "comment":"列举所有会员的订单信息，超级管理员可以使用",
    
    "request": [
        {"name":"state", "type":"string", "must":true, "options":["OK","WAIT","ALL"], "comment":"订单状态"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"查询起始行"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"返回记录数"}
    ],

    "vars": [
        {"name":"end", "val":"@{NOW|unit3600000}"}, //小时 
        {"name":"start", "val":"@{SUB|i,end,720}"}, //30天
        {"name":"mEnd", "val":"@{NOW|unit60000}"}, //分钟
        {"name":"mStart", "val":"@{SUB|i,end,43200}"} //30天
    ],
    
    "process" : [{
        "name" : "orders",
        "type" : "rdb",
        "db": "member",
        "sqls" : [
            {
                 "name": "list",
                 "metas":"cols",
                 "multi":true,
                 "sql":"select o.id,o.vip,o.createAt,o.creator,o.val,o.update_time updTime,o.state,
                     v.name,v.code
                    from orders o,vips v
                   where @{CONDITION|state,'s.==','ALL',`o.state in('OK','WAIT')`, `o.state='@{state}'`}
                     and v.id=o.vip
                   order by o.createAt desc
                  LIMIT @{num} OFFSET @{offset}"
            },
            {
                 "name": "get_total",
                 "metas":"each",
                 "merge":true,
                 "multi":false,
                 "sql":"select count(*) total from orders
                      @{CONDITION|state,'s.==','ALL',``,`where state='@{state}'`}"
            },
            {
                "name":"month_score",
                "multi":false,
                "metas":"each",
                "merge":true,
                "sql":"select ifnull(sum(vOrder),0) vOrder,ifnull(sum(nOrder),0) nOrder
                     from reports
                    where at>@{start}-1 and at<@{end}+1"
            },
            {
                "name":"month_brokerage",
                "multi":false,
                "metas":"each",
                "merge":true,
                "sql":"select ifnull(sum(brokerage),0) vBrokerage from brokerages
                    where createAt>@{mStart}-1 and createAt<@{mEnd}+1
                      and type='ORD'"
            }
        ]
    }],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，id:sequence id；vip:会员id；createAt:创建时间，UTC分钟；creator:创建人帐号；val:金额；updTime；state:状态：WAIT待确认，OK已确认；name:姓名或昵称；code:编码，比如游戏ID"},
            {"name":"total", "type":"int", "comment":"总充值额"},
            {"name":"vOrder", "type":"double", "comment":"新增订单金额"},
            {"name":"nOrder", "type":"int", "comment":"新增订单数量"},
            {"name":"vBrokerage", "type":"float", "comment":"提成"}
        ]
    }
}
]