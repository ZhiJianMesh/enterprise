[
{
    "name": "add",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature": "write",
    "comment":"创建会员基本信息",

    "request": [
        {"name":"name", "type":"string", "must":true, "max":255, "comment":"姓名"},
        {"name":"code", "type":"string", "must":true, "max":255, "comment":"编码，比如游戏帐号id"},
        {"name":"sex", "type":"string", "must":false, "default":"U", "options":["F","M","U"], "comment":"性别"},
        {"name":"birth", "type":"int", "must":false, "default":"0", "min":-25620, "max":73200, "comment":"生日，UTC天"},
        {"name":"mobile", "type":"string", "must":false, "default":"", "max":255, "reg":"^1\\d{10}$", "comment":"手机号"},
        {"name":"ext", "type":"json", "must":false, "max":2048, "default":{}, "comment":"扩展信息，与服务的设置有关"}
    ],
    
    "process" : [
        {
            "name" : "vipNum",
            "type":"dataexists",
            "db": "member",
            "expect" : false, //如果存在，则返回EXISTS，否则返回OK
            "sql" : "select * from vips where code='@{code}'"
        },
        {
            "name":"get_vip_id",
            "type" : "var",
            "vars":[
                {"name":"vipId", "val":"@{SEQUENCE|'vipid'}"}
            ]
        },
        {
            "name" : "create_vip",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                "insert into vips(id,creator,createAt,name,code,mobile,sex,birth,ext) values(
                    @{vipId},'@{#tokenAcc}',@{NOW|unit60000},'@{name}','@{code}',
                    '@{ENCODE|vipKey,mobile}','@{sex}',@{birth},'@{ext}')",
                //更新报表
                "insert or ignore into reports(at) values(@{NOW|unit3600000})",
                "update reports set vip=vip+1 where at=@{NOW|unit3600000}"
            ]
        },
        {
            "name" : "createSearch",
            "type" : "search",
            "db": "member",
            "action" : "put",
            "table" : "vip",
            "did" : "@{vipId}",
            "title" : "@{name}",
            "summary" : "@{SUBSTR|mobile,0,3} @{SUBSTR|mobile,7,4} @{code}",
            "content" : "@{ext}"
        }
    ],
    
    "response":[]
},

{
    "name": "setBase",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature": "write",
    "comment":"修改会员基本信息",
                
    "request": [
        {"name":"id", "type":"long", "must":true, "min":0, "comment":"会员ID"},
        {"name":"code", "type":"string", "must":false, "max":255, "comment":"编码，比如游戏帐号id"},
        {"name":"sex", "type":"string", "must":true, "options":["F","M"], "comment":"性别"},
        {"name":"birth", "type":"int", "must":true, "min":-25620, "max":73200, "comment":"生日，UTC天"},
        {"name":"name", "type":"string", "must":true, "max":255, "comment":"姓名"},
        {"name":"mobile", "type":"string", "must":true, "max":255, "reg":"^1\\d{10}$", "comment":"手机号"}
    ],

    "process" : [
        {
            "name" : "setMember",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                "update vips set
                    name='@{name}',
                    sex='@{sex}',
                    birth=@{birth},
                    @{IFVALID|code, `code='@{code}',`}
                    mobile='@{ENCODE|vipKey,mobile}'                    
                  where id=@{id}"
            ]
        },
                
        {
            "name" : "updateSearch",
            "type" : "search",
            "db": "member",
            "action" : "update",
            "table" : "vip",
            "did" : "@{id}",
            "title" : "@{name}",
            "summary" : "@{SUBSTR|mobile,0,3} @{SUBSTR|mobile,7,4} @{code}"
        }
    ],
    "response":[]
},

{
    "name": "setExt",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature": "write",
    "comment":"修改会员扩展信息",
                
    "request": [
        {"name":"id", "type":"long", "must":true, "min":0, "comment":"会员ID"},
        {"name":"ext", "type":"json", "must":false, "max":2048, "default":{}, "comment":"扩展信息，JSON"}
    ],

    "process" : [
        {
            "name" : "setMember",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                "update vips set ext='@{ext}' where id=@{id}"
            ]
        },
                
        {
            "name" : "updateSearch",
            "type" : "search",
            "db": "member",
            "action" : "update",
            "table" : "vip",
            "did" : "@{id}",
            "content" : "@{CLEAN|ext}"
        }
    ],
    "response":[]
},

{
    "name": "list",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker" : "RBAC",
    "feature":"admin",
    "comment":"列举会员信息，只有超级管理员可以查看，其他角色只能查看自己创建的，或通过搜索查看",
    
    "request": [
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"查询起始行"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"返回行数"}
    ],
 
    "vars": [
        {"name":"end", "val":"@{NOW|unit3600000}"},
        {"name":"start", "val":"@{SUB|i,end,720}"} //30天
    ],
    
    "process" : [
        {
            "name" : "list_vips",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                {
                    "name":"list",
                    "multi":true,
                    "metas" : "cols",
                    "sql":"select id,name,code,birth,sex,createAt
                         from vips
                        order by id desc
                       LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"total",
                    "multi":false,
                    "metas" : "each",
                    "merge":true,
                    "sql":"select count(*) as total from vips"
                },
                {
                    "name":"score",
                    "multi":false,
                    "metas":"each",
                    "merge":true,
                    "sql":"select ifnull(sum(vip),0) vip,
                            ifnull(sum(nOrder),0) nOrder,
                            ifnull(sum(nService),0) nService
                        from reports
                       where at>@{start}-1 and at<@{end}+1"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，id:seqid；name:姓名或昵称；code:编码，比如游戏ID；birth:出生年月日，UTC天；sex:性别，男M，女F，未知U；createAt:创建时间，UTC分钟"},
            {"name":"total", "type":"int", "comment":"总充值额"},
            {"name":"vip", "type":"int", "comment":"新增会员数量"},
            {"name":"nOrder", "type":"int", "comment":"新增订单数量"},
            {"name":"nService", "type":"int", "comment":"新增消费次数"}
        ]
    }
},

{
    "name": "my",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"列举我创建的会员信息",
    
    "request": [
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"起始行号"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"返回行数"}
    ],

    "vars": [
        {"name":"end", "val":"@{NOW|unit60000}"},
        {"name":"start", "val":"@{SUB|i,end,43200}"} //30天
    ],

    "process" : [
        {
            "name" : "list_vips",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                {
                    "name":"list",
                    "multi":true,
                    "metas" : "cols",
                    "sql":"select id,name,code,birth,sex,createAt
                         from vips where creator='@{#tokenAcc}'
                        order by id desc
                      LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"total",
                    "multi":false,
                    "metas" : "each",
                    "merge":true,
                    "sql":"select count(*) as total from vips
                        where creator='@{#tokenAcc}'"
                },
                {
                    "name":"vip_num",
                    "multi":false,
                    "metas":"each",
                    "merge":true,
                    "sql":"select count(*) vip from vips
                        where creator='@{#tokenAcc}'
                          and createAt>@{start}-1
                          and createAt<@{end}+1"
                },
                {
                    "name":"order_num",
                    "multi":false,
                    "metas":"each",
                    "merge":true,
                    "sql":"select count(*) nOrder from orders
                        where creator='@{#tokenAcc}'
                          and createAt>@{start}-1
                          and createAt<@{end}+1"
                },
                {
                    "name":"service_num",
                    "multi":false,
                    "metas":"each",
                    "merge":true,
                    "sql":"select count(*) nService from services
                        where creator='@{#tokenAcc}'
                          and createAt>@{start}-1
                          and createAt<@{end}+1"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，id:seqid；name:姓名或昵称；code:编码，比如游戏ID；birth:出生年月日，UTC天；sex:性别，男M，女F，未知U；createAt:创建时间，UTC分钟"},
            {"name":"total", "type":"int", "comment":"总充值额"},
            {"name":"vip", "type":"int", "comment":"会员id"},
            {"name":"nOrder", "type":"int", "comment":"新增订单数量"},
            {"name":"nService", "type":"int", "comment":"新增消费次数"}
        ]
    }
},

{
    "name": "get",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker" : "RBAC",
    "feature":"read",
    "comment":"获得会员详细信息",

    "request": [
        {"name":"id", "type":"int", "must":true, "min":0, "comment":"会员ID"}
    ],

    "process" : [
        {
            "name" : "getMember",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                {
                    "name":"detail",
                    "multi":false,
                    "metas" : "each",
                    "merge":true,
                    "sql":"select creator,createAt,name,mobile,birth,
                            sex,ext,code,balance,total
                           from vips where id=@{id}"
                }
            ]
        }
    ],
    
    "response": [
        {"name":"creator", "type":"string", "comment":"创建者帐号"},
        {"name":"createAt", "type":"long", "comment":"建档时间"},
        {"name":"name", "type":"string", "comment":"VIP称呼"},
        {"name":"code", "type":"string", "comment":"唯一编号"},
        {"name":"birth", "type":"int", "comment":"生日，UTC天"},
        {"name":"balance", "type":"double", "comment":"余额"},
        {"name":"total", "type":"double", "comment":"历史充值总额"},
        {"name":"sex", "type":"string", "comment":"性别"},
        {"name":"mobile", "type":"string", "codeMode":"decode", "keyName":"vipKey", "comment":"手机号"},
        {"name":"ext", "type":"json", "comment":"扩展信息，解析为json"}
    ]
},

{
    "name": "getBase",
    "method":"GET",
