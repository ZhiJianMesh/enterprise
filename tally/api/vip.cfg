},

{
    "name": "remove",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature":"admin",
    "comment":"删除会员详细信息",

    "request": [
        {"name":"id", "type":"int", "must":true, "min":0, "comment":"会员ID"}
    ],

    "process" : [
        {
            "name" : "removeMember",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                {
                    "name":"removeLogs",
                    "sql":"delete from services where vip=@{id}"
                },
                {
                    "name":"removeOrders",
                    "sql":"delete from orders where vip=@{id})"
                },
                {
                    "name":"removeMember",
                    "sql":"delete from vips where id=@{id})"
                }
            ]
        },
        {
            "name" : "removeSearch",
            "type" : "search",
            "db": "member",
            "action" : "rmv",
            "table" : "vip",
            "did" : "@{id}"
        }
    ]
},

{
    "name": "search",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"查询会员信息",

    "request": [
        {"name":"s", "type":"str", "must":true, "min":1, "comment":"关键词"},
        {"name":"limit", "type":"int", "must":false, "min":1, "default":10, "comment":"最大返回记录数"}
    ],

    "process" : [
        {
            "name" : "docs",
            "type" : "search",
            "db": "member",
            "action" : "get @{limit}",
            "table" : "vip",
            "content" : "@{s}"
        },
        
        {
            "name":"get_vips",
            "type":"rdb",
            "db":"member",
            "sqls":[{
                "name":"list",
                "multi":true,
                "metas":"cols",
                "sql":"select id,name,code,birth,sex,createAt
                 from vips where id in(@{LIST|!docs})"
            }]
        }
    ],
    
    "response": [
        {"name":"list", "type":"object", "list":true, "comment":"cols中返回列名称，id:会员ID；name:会员姓名；code:会员编码；birth:生日，UTC天；sex:性别；createAt:创建时间，UTC分钟"},
        {"name":"cols", "type":"string", "list":true, "comment":"数据列名称"}
    ]
}
]