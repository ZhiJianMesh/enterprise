{
    "name" : "baseInfo",
    "method" : "GET",
    "property" : "private",
    "tokenChecker" : "APP-*",
    "comment" : "查询雇员基本信息",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":1, "comment":"用户ID"}
    ],
    
    "process" : [
        {
            "name" : "get_employee",
            "type":"rdb",
            "db":"hr",
            "sqls" : [
                {
                    "name":"employee",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "sql" : "select E.office,E.post,E.account,E.email,E.addr,
                        Z.timeOff,O.name office
                      from employee E, office O, zone Z
                     where E.uid=@{uid} and E.state='NORM'
                      and O.id=E.office and Z.id=O.zone"
                },
                {
                    "name":"pool",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "sql" : "select sex,name,phone from pool where uid=@{uid}"
                }
            ]
        }    
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"office", "type":"int", "comment":"办公地点，与基本工资、日薪挂钩"},
            {"name":"post", "type":"int", "comment":"任职级别，任职资格与任职级别与军衔、军职对应"},
            {"name":"account", "type":"string", "comment":"帐号，与uid保持一致"},
            {"name":"email", "type":"string", "comment":"公司邮箱"},
            {"name":"addr", "type":"string", "comment":"住址"},
            {"name":"timeOff", "type":"int", "comment":"时区时间偏差，UTC分钟，默认东8区"},
            {"name":"sex", "type":"string", "comment":"性别：F女，M男，U未知"},
            {"name":"name", "type":"string", "comment":"名称"},
            {"name":"phone", "type":"string", "comment":"电话"}
        ]
    }
},
{
    "name" : "update",
    "method" : "PUT",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment" : "雇员自己修改雇员信息",

    "request": [
        {"name":"addr", "type":"string", "must":false, "len":80, "comment":"地址"},
        {"name":"email", "type":"string", "must":false,
         "regular":"^(?i)[a-z0-9._-]+@[a-z0-9_-]+(\\.[a-z0-9_-]+){1,4}$",
         "comment":"内部邮箱，如果没有，可以使用私人邮箱"},
        {"name":"phone", "type":"string", "must":true, "min":7, "comment":"手机号"}
    ],
    
    "process" : [
        {
            "name" : "update_employee_info",
            "type" : "rdb",
            "db":"hr",
            "sqls" : [
                "update employee set
                    @{IFVALID|addr,`addr='@{addr}',`}
                    @{IFVALID|email,`email='@{email}',`}
                    phone='@{phone}'
                 where uid=@{#tokenCaller}"
            ]
        },
        {
            "name" : "update_search",
            "type" : "search",
            "db":"hr",
            "action" : "update",
            "table" : "employee",
            "did" : "@{#tokenCaller}",
            "content":"@{addr} @{email} @{phone}"
        }
    ],
    "response":[]
},
{
    "name" : "setZone",
    "method" : "PUT",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment" : "修改雇员所在区域与作息时间",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":1, "comment":"用户id"},
        {"name":"office", "type":"int", "must":true, "min":0, "comment":"办公区域"},
        {"name":"worktime", "type":"int", "must":true, "min":0, "comment":"作息制度"}
    ],
    
    "process" : [{
        "name" : "update_employee_zone",
        "type" : "rdb",
        "db" : "hr",
        "sqls" : [
            {
                "name" : "user_info",
                "metas" : "each",
                "merge" : true,
                "multi" : false,
                "sql" : "select worktime oldWt,office oldOff from employee where uid=@{uid}"
            },
            "update employee set
                office=@{office},
                worktime=@{worktime}
             where uid=@{uid}",
             
            "update worktime set usedTimes=usedTimes-1 where id=@[!oldWt]",
            "update office set usedTimes=usedTimes-1 where id=@[!oldOff]",

            "update worktime set usedTimes=usedTimes+1 where id=@{worktime}",
            "update office set usedTimes=usedTimes+1 where id=@{office}"
        ]
    }],
    "response":[]
},

{
    "name" : "toggleHide",
    "method" : "PUT",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature":"hr",
    "comment" : "切换隐藏与不隐藏",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":1, "comment":"用户id"},
        {"name":"state", "type":"string", "must":true, "options":["HIDE","NORM"], "comment":"状态"}
    ],
    
    "process" : [{
        "name" : "update_employee_state",
        "type" : "rdb",
        "db":"hr",
        "sqls" : [
            "update employee set
                state='@{state}'
             where uid=@{uid}"
        ]
    }],
    "response":[]
},

{
    "name" : "setAttendance",
    "method" : "PUT",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature":"hr",
    "comment" : "设置考勤方式、办公区、作息时间",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":1, "comment":"用户id"},
        {"name":"type", "type":"string", "must":true, "comment":"考勤方式",
         "options":["NORM","LAN","REMO","FREE"]},
        {"name":"office", "type":"int", "must":true, "min":0, "comment":"办公区"},
        {"name":"worktime", "type":"int", "must":true, "min":0, "comment":"作息时间"}
    ],

    "process" : [
        {
            "name" : "update_attendance",
            "type" : "rdb",
            "db" : "hr",
            "sqls" : [
                "update employee set 
                  attend='@{type}',
                  office=@{office},
                  worktime=@{worktime}
                 where uid=@{uid}"
            ]
        }
    ],
    "response":[]
},
{
    "name" : "setWeal",
    "method" : "PUT",
