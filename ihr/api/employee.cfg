[
{
    "name" : "list",
    "method" : "GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment" : "逐页查询雇员",

    "request": [
        {"name":"num", "type":"int", "must":false, "min":1, "default":10, "comment":"查询数量"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"偏移"}
    ],

    "process" : [
        {
            "name" : "list_employees",
            "type":"rdb",
            "db":"hr",
            "sqls" : [
                {
                    "name":"list",
                    "metas" : "cols",
                    "merge" : false,
                    "multi" : true,
                    "sql" : "select e.uid,e.office,e.account,e.worktime,e.quali,e.post,
                        e.email,p.name,p.phone,p.sex
                     from employee e,pool p
                     where e.state='NORM' and p.uid=e.uid
                     order by e.uid asc
                     LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"get_total",
                    "metas" : "each",
                    "merge":true,
                    "multi":false,
                    "sql":"select count(*) total from employee where state='NORM'"
                }
            ]
        }    
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，uid:雇员id，用户ID，报给财务系统；office:办公地点，与基本工资、日薪挂钩；account:帐号，与uid保持一致；worktime:作息时间；quali:任职资格级别，表示能力值；post:任职级别，任职资格与任职级别与军衔、军职对应；email:公司邮箱；name:工作流名称；phone:办公电话；sex:性别：F女，M男，U未知"},
            {"name":"total", "type":"int", "comment":"总数"}
        ]
    }
},
{
    "name" : "listAll",
    "method" : "GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker" : "RBAC",
    "feature" : "admin",
    "comment" : "逐页查询雇员，可以查到所有NORM/HIDE的雇员",

    "request": [
        {"name":"num", "type":"int", "must":false, "min":1, "default":10, "comment":"查询数量"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"偏移"}
    ],
    
    "process" : [
        {
            "name" : "list_employees",
            "type":"rdb",
            "db":"hr",
            "sqls" : [
                {
                    "name":"list",
                    "metas" : "cols",
                    "merge" : false,
                    "multi" : true,
                    "sql" : "select e.uid,e.office,e.quali,e.post,e.account,
                        e.worktime,e.email,e.entryAt,e.state,
                        p.name,p.phone,p.sex,p.birth
                     from employee e,pool p
                     where e.state in('NORM','HIDE') and p.uid=e.uid
                     order by e.uid asc
                     LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"get_total",
                    "metas" : "each",
                    "merge":true,
                    "multi":false,
                    "sql":"select count(*) total from employee
                        where state in('NORM','HIDE')"
                }
            ]
        }    
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，uid:雇员id，用户ID，报给财务系统；office:办公地点，与基本工资、日薪挂钩；quali:任职资格级别，表示能力值；post:任职级别，任职资格与任职级别与军衔、军职对应；account:帐号，与uid保持一致；worktime:作息时间；email:公司邮箱；entryAt:最近一次入职日期，UTC分钟，年休假参考入职日期计算；state:状态；name:工作流名称；phone:办公电话；sex:性别F女，M男，U未知；birth:出生时间，UTC分钟"},
            {"name":"total", "type":"int", "comment":"总数"}
        ]
    }
},
