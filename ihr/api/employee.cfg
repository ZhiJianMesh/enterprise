{
    "name" : "search",
    "method" : "GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker" : "RBAC",
    "feature" : "hr",
    "comment" : "查询雇员库",

    "request": [
        {"name":"s", "type":"string", "must":true, "min":1, "comment":"搜索内容，多个关键词用逗号分隔"},
        {"name":"limit", "type":"int", "must":true, "min":1}
    ],
    
    "process" : [
        {
            "name" : "docs",
            "type" : "search",
            "db" : "hr",
            "action" : "get @{limit}",
            "table" : "employee",
            "content" : "@{s}"
        },
        {
            "name" : "list_pool",
            "type":"rdb",
            "db":"hr",
            "sqls" : [{
                "name":"pool",
                "metas" : "cols",
                "merge" : false,
                "multi" : true,
                "sql" : "select e.uid,e.office,e.quali,e.post,e.account,
                        e.worktime,e.email,e.entryAt,
                        p.name,p.phone,p.sex,p.birth
                     from employee e,pool p
                     where e.uid in(@{LIST|!docs}) and p.uid=e.uid
                     order by e.uid asc"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"pool", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，uid:雇员id，用户ID，报给财务系统；office:办公地点，与基本工资、日薪挂钩；quali:任职资格级别，表示能力值；post:任职级别，任职资格与任职级别与军衔、军职对应；account:帐号，与uid保持一致；worktime:作息时间；email:公司邮箱；entryAt:最近一次入职日期，UTC分钟，年休假参考入职日期计算；name:工作流名称；phone:办公电话；sex:性别：F女，M男，U未知；birth:出生时间，UTC分钟"}
        ]
    }
},
{
    "name" : "get",
    "method" : "GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker" : "RBAC",
    "feature" : "hr",
    "comment" : "查询雇员详情",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":1, "comment":"用户ID"}
    ],

    "process" : [
        {
            "name" : "get_employee",
            "type":"rdb",
            "db":"hr",
            "sqls" : [
                {
                    "name":"employee",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "sql" : "select e.office,e.state,e.account,
                        e.salary,e.dSalary,e.hSalary,e.subsidy,e.stock,
                        e.quali,e.post,e.entryAt,e.worktime,e.attend,e.addr,e.email,
                        e.holiday,e.weal,e.sickRatio,o.zone
                      from employee e,office o
                     where e.uid=@{uid} and o.id=e.office"
                },
                {
                    "name":"leaving",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "ignores":["NOT_EXISTS"],
                    "sql" : "select name recentFlow from flowdata where uid=@{uid}
                         order by createAt desc limit 1"
                },
                {
                    "name":"pool",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "sql" : "select maxEdu,firstEdu,sex,birth,name,phone
                     from pool where uid=@{uid}"
                }
            ]
        }    
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"office", "type":"int", "comment":"办公地点，与基本工资、日薪挂钩"},
            {"name":"state", "type":"string", "comment":"状态"},
            {"name":"account", "type":"string", "comment":"帐号，与uid保持一致"},
            {"name":"salary", "type":"double", "comment":"基本工资(包括五险一金中个人缴纳的部分)"},
            {"name":"dSalary", "type":"double", "comment":"日薪，比如salary/22，用于计算请假、加班的工资"},
            {"name":"hSalary", "type":"double", "comment":"时薪，比如dSalary/8，用于计算请假、加班的工资"},
            {"name":"subsidy", "type":"double", "comment":"出差每日补贴基数，不同地区乘以不同系数"},
            {"name":"stock", "type":"double", "comment":"拥有的股份"},
            {"name":"quali", "type":"int", "comment":"任职资格级别，表示能力值"},
            {"name":"post", "type":"int", "comment":"任职级别，任职资格与任职级别与军衔、军职对应"},
            {"name":"entryAt", "type":"int", "comment":"最近一次入职日期，UTC分钟，年休假参考入职日期计算"},
            {"name":"worktime", "type":"int", "comment":"作息时间"},
            {"name":"attend", "type":"string", "comment":"考勤方式"},
            {"name":"addr", "type":"string", "comment":"住址"},
            {"name":"email", "type":"string", "comment":"公司邮箱"},
            {"name":"holiday", "type":"int", "comment":"年休假配额，单位天"},
            {"name":"weal", "type":"int", "comment":"福利假配额，单位小时，比如三八节、体检等"},
            {"name":"sickRatio", "type":"double", "comment":"病假工资比率，最低0.6，最大1.0"},
            {"name":"zone", "type":"int", "comment":"所属区域id，数量不多，所以不建索引"},
            {"name":"recentFlow", "type":"string", "comment":"工作流名称"},
            {"name":"maxEdu", "type":"string", "comment":"最高学历，从E1到Ex，每种语言定义不同"},
            {"name":"firstEdu", "type":"string", "comment":"第一学历"},
            {"name":"sex", "type":"string", "comment":"性别：F女，M男，U未知"},
            {"name":"birth", "type":"int", "comment":"出生时间，utc分钟"},
            {"name":"name", "type":"string", "comment":"名称"},
            {"name":"phone", "type":"string", "comment":"电话"}
        ]
    }
},
{
    "name" : "my",
    "method" : "GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment" : "雇员查询自己的信息",

    "process" : [
        {
            "name" : "get_employee_info",
            "type":"rdb",
            "db":"hr",
            "sqls" : [
                {
                    "name":"employee",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "sql" : "select e.salary,e.subsidy,
                        e.quali,e.post,e.entryAt,e.attend,e.email,
                        e.holiday,e.weal,e.sickRatio,e.phone,
                        z.fowSalary,z.oowSalary,z.wowSalary,z.name zName,
                        o.zone,o.name office,w.name worktime
                      from employee e,office o,zone z,worktime w
                     where e.uid=@{#tokenCaller}
                       and o.id=e.office and z.id=o.zone and w.id=e.worktime"
                },
                {
                    "name":"securities",
                    "metas" : "each",
                    "merge" : false,
                    "multi" : true,
                    "sql" : "select sponsor,type,val,name
                     from security where zone=@[!zone]"
                }
            ]
        }    
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"salary", "type":"double", "comment":"基本工资(包括五险一金中个人缴纳的部分)"},
            {"name":"subsidy", "type":"double", "comment":"出差每日补贴基数，不同地区乘以不同系数"},
            {"name":"quali", "type":"int", "comment":"任职资格级别，表示能力值"},
            {"name":"post", "type":"int", "comment":"任职级别，任职资格与任职级别与军衔、军职对应"},
            {"name":"entryAt", "type":"int", "comment":"最近一次入职日期，UTC分钟，年休假参考入职日期计算"},
            {"name":"attend", "type":"string", "comment":"考勤方式"},
            {"name":"email", "type":"string", "comment":"公司邮箱"},
            {"name":"holiday", "type":"int", "comment":"年休假配额，单位天"},
            {"name":"weal", "type":"int", "comment":"福利假配额，单位小时，比如三八节、体检等"},
            {"name":"sickRatio", "type":"double", "comment":"病假工资比率，最低0.6，最大1.0"},
            {"name":"phone", "type":"string", "comment":"办公电话"},
            {"name":"fowSalary", "type":"double", "comment":"节假日加班工资系数"},
            {"name":"oowSalary", "type":"double", "comment":"休息日加班工资系数"},
            {"name":"wowSalary", "type":"double", "comment":"延时加班工资系数，按时计薪"},
            {"name":"zName", "type":"string", "comment":"区域名称"},
            {"name":"zone", "type":"int", "comment":"所属区域id，数量不多，所以不建索引"},
            {"name":"office", "type":"int", "comment":"办公地点，与基本工资、日薪挂钩"},
            {"name":"worktime", "type":"int", "comment":"作息时间"},
            {"name":"securities", "type":"object", "list":true, "props":[
                {"name":"sponsor", "type":"string", "comment":"出资人：C公司，P个人"},
                {"name":"type", "type":"string", "comment":"类型：R比率，V定值"},
                {"name":"val", "type":"double", "comment":"数值，由HR设置，按比率时，设置成小数"},
                {"name":"name", "type":"string", "comment":"工作流名称"}
            ]}
        ]
    }
},
{
    "name" : "subsidy",
