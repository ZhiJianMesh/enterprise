{
    "name" : "list",
    "method" : "GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "feature":"hr",
    "comment" : "查询雇员的所有工作流",

    "request": [
        {"name":"uid", "type":"int", "must":true, "min":1, "comment":"用户id"},
        {"name":"offset", "type":"int", "must":true, "min":0, "comment":"偏移"},
        {"name":"num", "type":"int", "must":true, "min":1, "comment":"数量"}
    ],
    
    "process" : [
        {
            "name" : "list_workflows",
            "type" : "rdb",
            "db":"hr",
            "sqls" : [
                {
                    "name":"list",
                    "metas" : "each",
                    "merge" : false,
                    "multi" : true,
                    "sql" : "select flowid,did,flSta,createAt,name,dispName
                        from flowdata where uid=@{uid}
                        order by createAt desc
                        LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"get_total",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "sql" : "select count(*) total
                        from flowdata where uid=@{uid}"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "props":[
                {"name":"flowid", "type":"int", "comment":"工作流id"},
                {"name":"did", "type":"int", "comment":"数据id,seqid"},
                {"name":"flSta", "type":"int", "comment":"工作流状态"},
                {"name":"createAt", "type":"int", "comment":"创建时间，UTC分钟"},
                {"name":"name", "type":"string", "comment":"工作流名称"},
                {"name":"dispName", "type":"string", "comment":"工作流显示名称"}
            ]},
            {"name":"total", "type":"int", "comment":"总数"}
        ]
    }
},
{
    "name" : "get",
    "method" : "GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment" : "在工作流中查询员工或人才的详情，通过判断是否为工作流参与人来确定查看权限",

    "request": [
        {"name":"id", "type":"int", "must":true, "min":0, "comment":"工作流数据id"}
    ],

    "process" : [
        {
            "name" : "get_flowdata",
            "type" : "rdb",
            "db":"hr",
            "sqls" : [
                {
                    "name":"flowdata",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "sql" : "select flowid,did,uid,flSta status,flSta+1 step,
                         createAt,name,dispName,data
                        from flowdata where did=@{id}"
                },
                {
                    "name":"employee",
                    "metas" : "each",
                    "merge" : true,
                    "multi" : false,
                    "ignores":["NOT_EXISTS"],
                    "sql" : "select o.name office,w.name worktime,e.state,e.account,
                        e.salary,e.dSalary,e.hSalary,e.subsidy,e.stock,
                        e.quali,e.post,e.entryAt,e.addr,e.email
                      from employee e, worktime w, office o
                     where e.uid=@[!uid] and w.id=e.worktime and o.id=e.office"
                },
                {
                    "name":"pool",
                    "metas": "each",
                    "merge": true,
                    "multi": false,
                    "sql": "select maxEdu,firstEdu,sex,birth,name,phone
                     from pool where uid=@[!uid]"
                }
            ]
        },
        {
            "name":"check_signer",
            "comment":"鉴权，询问workflow当前帐号是否为这个工作流中的权签人",
            "type" : "call",
            "service": "workflow",
            "method":"GET",
            "tokenSign":"APP",
            "url":"/isSigner?did=@{id}&flowid=@{!flowid}&account=@{#tokenAcc}"
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"flowid", "type":"int", "comment":"工作流id"},
            {"name":"did", "type":"int", "comment":"数据id,seqid"},
            {"name":"uid", "type":"int", "comment":"工作流涉及的用户id"},
            {"name":"status", "type":"int", "comment":"状态"},
            {"name":"step", "type":"string", "comment":"步骤号"},
            {"name":"createAt", "type":"int", "comment":"创建时间，UTC分钟"},
            {"name":"name", "type":"string", "comment":"名称"},
