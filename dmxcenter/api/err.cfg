[
{
    "name": "list",
    "method":"GET",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"RBAC",
    "comment":"查看错误请求",
    
    "request": [
        {"name":"offset", "type":"int", "must":true, "min":0, "comment":"开始"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"查询数量"}
    ],

    "process" : [{
        "name" : "get_errreqs",
        "type" : "rdb",
        "db":"device",
        "sqls": [
            {
                "name": "get_total",
                "metas" : "each",
                "multi": false,
                "merge": true,
                "sql":"select count(*) total from errreqs"
            },
            {
                "name": "errs",
                "metas" : "cols",
                "multi": true,
                "merge": false,
                "sql":"select device,times,update_time from errreqs
                 order by update_time desc
                 limit @{num} offset @{offset}"
            }
        ]
    }],
    "response":{
        "check":false,
        "segments":[
            {"name":"total", "type":"int"},
            {"name":"errs", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，device:设备ID；times:查询次数；update_time:UTC更新时间"}
        ]
    }
},

{
    "name": "remove",
    "method":"DELETE",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"RBAC",
    "comment":"删除错误请求",
    
    "request": [
        {"name":"code", "type":"STRING", "must":true, "min":0, "comment":"错误设备号"}
    ],

    "process" : [{
        "name" : "rmv_errreqs",
        "type" : "rdb",
        "db":"device",
        "sqls": [
            "delete from errreqs where device='@{code}'"
        ]
    }]
},
{
    "name": "excess",
    "method":"GET",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"RBAC",
    "comment":"查看过量请求",
    
    "request": [
        {"name":"offset", "type":"int", "must":true, "min":0, "comment":"开始"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"查询数量"}
    ],

    "process" : [{
        "name" : "get_excess_devices",
        "type" : "rdb",
        "db":"device",
        "sqls": [
            {
                "name": "get_total",
                "metas" : "each",
                "multi": false,
                "merge": true,
                "sql":"select count(*) total from reqtimes where times>10"
            },
            {
                "name": "list",
                "metas" : "cols",
                "multi": true,
                "merge": false,
                "sql":"select device,times,day from reqtimes where times>10
                 order by times desc
                 limit @{num} offset @{offset}"
            }
        ]
    }],
    "response":{
        "check":false,
        "segments":[
            {"name":"total", "type":"int"},
            {"name":"list", "type":"object", "list":true, "comment":"每行按数组返回，顺序见响应中的 cols，device:设备ID；times:查询次数；day:UTC天"}
        ]
    }
},

{
    "name": "removeExcess",
    "method":"DELETE",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"RBAC",
    "comment":"删除过量请求记录",
    
    "request": [
        {"name":"code", "type":"STRING", "must":true, "min":0, "comment":"错误设备号"},
        {"name":"day", "type":"int", "must":true, "min":0, "comment":"UTC天"}
    ],

    "process" : [{
        "name" : "rmv_errreqs",
        "type" : "rdb",
        "db":"device",
        "sqls": [
            "delete from reqtimes where device='@{code}' and day=@{day}"
        ]
    }]
}
]