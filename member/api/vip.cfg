[
{
    "name": "add",
    "method":"POST",
    "feature": "write",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "comment":"创建会员基本信息",

    "request": [
        {"name":"name", "type":"string", "must":true, "max":255, "comment":"会员姓名"},
        {"name":"sex", "type":"string", "must":true, "options":["F","M"], "comment":"性别"},
        {"name":"birth", "type":"int", "must":true, "min":-25620, "max":73200, "comment":"生日，UTC天"},
        {"name":"mobile", "type":"string", "must":true, "max":255, "reg":"^1\\d{10}$", "comment":"手机号"},
        {"name":"pwd", "type":"string", "must":true, "min":1, "max":6, "reg":"^\\w+$", "comment":"消费密码，可以设置简单密码"},
        {"name":"ext", "type":"json", "must":false, "max":2048, "default":{}, "comment":"扩展信息"}
    ],
    
    "process" : [
        {
            "name" : "vipNum",
            "type":"dataexists",
            "db": "member",
            "expect" : false, //如果存在，则返回EXISTS，否则返回OK
            "sql" : "select * from vips where mobile='@{mobile}'"
        },
        {
            "name":"get_vip_id",
            "type" : "var",
            "vars":[
                {"name":"vipId", "val":"@{SEQUENCE|'vipid'}"}
            ]
        },
        {
            "name" : "createMember",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                "insert into vips(id,creator,createAt,name,mobile,pwd,sex,birth,ext) values(
                        @{vipId},'@{#tokenAcc}',@{#reqAt},'@{name}','@{ENCODE|vipKey,mobile}',
                        '@{PBKDF|2,pwd}','@{sex}',@{birth},'@{ext}')",
                {
                    "name":"updateReport",
                    "comment":"更新总报表",
                    "sql":"insert or ignore into mainreports(reportAt) values(@{NOW|unit7200000});
                       update mainreports set vipNum=vipNum+1 where reportAt=@{NOW|unit7200000}"
                }
            ]
        },
        
        {
            "name" : "createSearch",
            "type" : "search",
            "db": "member",
            "action" : "put",
            "table" : "vip",
            "did" : "@{vipId}",
            "title" : "@{name}",
            "summary" : "@{SUBSTR|mobile,0,3} @{SUBSTR|mobile,7,4}",
            "content" : "@{ext}"
        }
    ],
    
    "response":[]
},

{
    "name": "setBase",
    "method":"POST",
    "feature": "write",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "comment":"修改会员基本信息",
                
    "request": [
        {"name":"id", "type":"long", "must":true, "min":0, "comment":"会员ID"},
        {"name":"sex", "type":"string", "must":true, "options":["F","M"], "comment":"性别"},
        {"name":"birth", "type":"int", "must":true, "min":-25620, "max":73200, "comment":"生日，UTC天"},
        {"name":"name", "type":"string", "must":true, "max":255, "comment":"会员姓名"},
        {"name":"mobile", "type":"string", "must":true, "max":255, "reg":"^1\\d{10}$", "comment":"手机号"}
    ],

    "process" : [
        {
            "name" : "setMember",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                "update vips set name='@{name}',sex='@{sex}',birth=@{birth},
                  mobile='@{ENCODE|vipKey,mobile}' where id=@{id}"
            ]
        },
                
        {
            "name" : "updateSearch",
            "type" : "search",
            "db": "member",
            "action" : "update",
            "table" : "vip",
            "did" : "@{id}",
            "title" : "@{name}",
            "summary" : "@{SUBSTR|mobile,0,3} @{SUBSTR|mobile,7,4}"
        }
    ],
    "response":[]
},

{
    "name": "setExt",
    "method":"POST",
    "feature": "write",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "comment":"修改会员扩展信息",
                
    "request": [
        {"name":"id", "type":"long", "must":true, "min":0, "comment":"会员ID"},
        {"name":"ext", "type":"json", "must":false, "max":2048, "default":{}, "comment":"扩展信息"}
    ],

    "process" : [
        {
            "name" : "setMember",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                "update vips set ext='@{ext}' where id=@{id}"
            ]
        },
                
        {
            "name" : "updateSearch",
            "type" : "search",
            "db": "member",
            "action" : "update",
            "table" : "vip",
            "did" : "@{id}",
            "content" : "@{CLEAN|ext}"
        }
    ],
    "response":[]
},

{
    "name": "changePassword",
    "method":"POST",
    "feature":"admin",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "comment":"修改会员密码，只有企业主可以修改",
                
    "request": [
        {"name":"id", "type":"long", "must":true, "min":0, "comment":"会员ID"},
        {"name":"pwd", "type":"string", "must":true, "min":1, "max":100, "comment":"消费密码"}
    ],

    "process" : [
        {
            "name" : "chgPwd",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                "update vips set pwd='@{PBKDF|2,pwd}' where id=@{id}"
            ]
        }
    ]
},

{
    "name": "list",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"列举会员信息",
    
    "request": [
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"起始行"},
        {"name":"num", "type":"int", "must":false, "min":5, "default":10, "comment":"返回行数"}
    ],
    
    "process" : [
        {
            "name" : "listMembers",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                {
                    "name":"vips",
                    "multi":true,
                    "metas" : "each",
                    "sql":"select id,name,birth,sex,update_time from vips
                     order by update_time desc
                      LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name":"total",
                    "multi":false,
                    "metas" : "each",
                    "merge":true,
                    "sql":"select count(*) as total from vips"
                }
            ]
        }
    ],
    "response": [
        {"name":"vips", "type":"object", "list":true, "props":[
	    {"name":"id", "type":"string", "comment":"会员ID"},
            {"name":"name", "type":"string", "comment":"VIP称呼"},
            {"name":"birth", "type":"int", "comment":"生日,UTC天"},
            {"name":"sex", "type":"string", "comment":"性别"},
            {"name":"update_time", "type":"long", "comment":"更新时间，UTC"}
	]},
        {"name":"total", "type":"int", "comment":"总数"}
    ]
},

{
    "name": "get",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"获得会员详细信息",

    "request": [
        {"name":"id", "type":"long", "must":true, "min":0, "comment":"会员ID"}
    ],

    "process" : [
        {
            "name" : "getMember",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                {
                    "name":"detail",
                    "multi":false,
                    "metas" : "each",
                    "merge":true,
                    "sql":"select creator,createAt,name,mobile,birth,sex,ext from vips where id=@{id}"
                }
            ]
        }
    ],
    
    "response": [
        {"name":"creator", "type":"string", "comment":"创建人"},
        {"name":"createAt", "type":"long", "comment":"建档时间"},
        {"name":"name", "type":"string", "comment":"VIP称呼"},
        {"name":"birth", "type":"int", "comment":"生日,UTC天"},
        {"name":"sex", "type":"string", "comment":"性别"},
        {"name":"mobile", "type":"string", "codeMode":"decode", "keyName":"vipKey", "comment":"手机号"},
        {"name":"ext", "type":"json", "comment":"扩展信息，解析为json"}
    ]
},

{
    "name": "remove",
    "method":"GET",
    "feature":"admin",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "comment":"删除会员详细信息",

    "request": [
        {"name":"id", "type":"long", "must":true, "min":0}
    ],

    "process" : [
        {
            "name" : "removeMember",
            "type" : "rdb",
            "db": "member",
            "sqls" : [
                {
                    "name":"removeLogs",
                    "sql":"delete from consumelogs
                     where order_id in(select id from orders where vip=@{id})"
                },
                {
                    "name":"removeOrders",
                    "sql":"delete from orders where vip=@{id})"
                },
                {
                    "name":"removeMember",
                    "sql":"delete from vips where id=@{id})"
                }
            ]
        },
        {
            "name" : "removeSearch",
            "type" : "search",
            "db": "member",
            "action" : "rmv",
            "table" : "vip",
            "did" : "@{id}"
        }
    ]
},

{
    "name": "search",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"查询会员信息",

    "request": [
        {"name":"s", "type":"str", "must":true, "min":1, "comment":"搜索关键词"},
        {"name":"limit", "type":"int", "must":true, "min":1, "comment":"最多查找记录数"}
    ],

    "process" : [
        {
            "name" : "docs",
            "type" : "search",
            "db": "member",
            "action" : "get @{limit}",
            "table" : "vip",
            "content" : "@{s}"
        },
        
        {
            "name":"vips",
            "type":"rdb",
            "db":"member",
            "sqls":[{
                "name":"vips",
                "multi":true,
                "metas" : "each",
                "sql":"select id,name,birth,sex,update_time
                 from vips where id in(@{LIST|!docs})"
            }]
        }
    ],
    
    "response": [
        {"name":"vips", "type":"object", "list":true, "props":[
	    {"name":"id", "type":"string", "comment":"会员ID"},
            {"name":"name", "type":"string", "comment":"VIP称呼"},
            {"name":"birth", "type":"int", "comment":"生日,UTC天"},
            {"name":"sex", "type":"string", "comment":"性别"},
            {"name":"update_time", "type":"long", "comment":"更新时间，UTC"}
	]}
    ]
}
]