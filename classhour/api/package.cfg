[
{
    "name": "set",
    "method":"POST",
    "feature":"admin",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker":"RBAC",
    "comment":"创建套餐",

    "request": [
        {"name":"name", "type":"string", "must":true, "max":255},
        {"name":"val", "type":"int", "must":true, "min":0},
        {"name":"price", "type":"float", "must":true, "min":0},
        {"name":"ext", "type":"json", "must":true, "max":2048}
    ],
    
    "process" : [
        {
            "name" : "setPackage",
            "type" : "rdb",
            "db": "classhour",
            "sqls" : [
                "replace into packages(id,createAt,name,val,price,ext) values(
                   @{ABSHASH|i,name},@{#reqAt},'@{name}',@{val},@{price},'@{ext}')"
            ]
        }
    ]
},

{
    "name": "list",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"列举套餐信息",

    "process" : [
        {
            "name" : "listPackages",
            "type" : "rdb",
            "db": "classhour",
            "sqls" : [
                {
                    "name":"packages",
                    "metas" : "each",
                    "multi":true,
                    "sql":"select id,createAt,name,val,price,ext
                    from packages order by update_time desc"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"packages", "type":"object", "list":true, "props":[
                {"name":"id", "type":"int", "comment":"abshash(name)"},
                {"name":"createAt", "type":"long", "comment":"创建日期，UTC时间"},
                {"name":"name", "type":"string", "comment":"套餐名称"},
                {"name":"val", "type":"int", "comment":"价值，课时数"},
                {"name":"price", "type":"double", "comment":"价格"},
                {"name":"ext", "type":"string", "comment":"扩展信息"}
            ]}
        ]
    }
},

{
    "name": "get",
    "method":"GET",
    "property" : "private",
    "tokenChecker" : "USER",
    "comment":"获得套餐信息",
                
    "request": [
        {"name":"id", "type":"int", "must":true, "min":0}
    ],

    "process" : [
        {
            "name" : "getPackage",
            "type" : "rdb",
            "db": "classhour",
            "sqls" : [
                {
                    "multi":false,
                    "merge":true,
                    "sql":"select createAt,name,val,price,ext from packages where id=@{id}"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"createAt", "type":"long", "comment":"创建日期，UTC时间"},
            {"name":"name", "type":"string", "comment":"套餐名称"},
            {"name":"val", "type":"int", "comment":"价值，课时数"},
            {"name":"price", "type":"double", "comment":"价格"},
            {"name":"ext", "type":"string", "comment":"扩展信息"}
        ]
    }
},

{
    "name": "remove",
    "method":"DELETE",
    "feature":"admin",
    "property": "private",
    "tokenChecker" : "USER",
    "aclCheck":"RBAC",
    "comment":"删除套餐",

    "request": [
        {"name":"id", "type":"int", "must":true, "min":0}
    ],

    "process" : [
        {
            "name" : "removePackage",
            "type" : "rdb",
            "db": "classhour",
            "sqls" : [
                "delete from packages where id=@{id}"
            ]
        }
    ]
}
]