[
{
    "name": "list",
    "method": "GET",
    "property": "private",
    "tokenChecker": "USER",
    "aclChecker":"RBAC",
    "feature":"admin,purchaser",
    "request": [
        {"name":"page", "type":"int", "must":true},
        {"name":"pageSize", "type":"int", "must":false, "default":20},
        {"name":"categoryId", "type":"int", "must":false, "comment":"按分类筛选"},
        {"name":"supplierId", "type":"int", "must":false, "comment":"按供应商筛选"},
        {"name":"lowStock", "type":"bool", "must":false, "default":false, "comment":"仅显示库存不足"}
    ],
    "process": [
        {
            "name": "get_products",
            "type": "rdb",
            "db": "inventory",
            "sqls": [
                {
                    "name": "total",
                    "multi": false,
                    "merge": true,
                    "metas": "each",
                    "sql": "select count(*) as total from products where 1=1
                          @{IFVALID|categoryId, ' and category=', categoryId}
                          @{IFVALID|supplierId, ' and supplier=', supplierId}
                          @{IFVALID|lowStock, ' and stock<=minStock', ''}"
                },
                {
                    "name": "list",
                    "multi": true,
                    "metas": "each",
                    "sql": "select p.id,p.name,c.id categoryId,c.name as categoryName,p.price,p.costPrice,p.stock,p.minStock,p.unit,s.id supplierId,s.name as supplierName,p.barcode,p.remark
                     from products p
                     left join categories c on p.category=c.id
                     left join suppliers s on p.supplier=s.id
                     where 1=1
                     @{IFVALID|categoryId, ' and p.category=', categoryId}
                     @{IFVALID|supplierId, ' and p.supplier=', supplierId}
                     @{IFVALID|lowStock, ' and p.stock<=p.minStock', ''}
                     order by p.id desc
                     limit @{pageSize} offset @{CALCULATE|i,(page-1)*pageSize}"
                }
            ]
        }
    ],
    "response": [
        {"name":"total", "type":"int"},
        {"name":"list", "type":"object", "list":true, "props":[
            {"name":"id", "type":"int"},
            {"name":"name", "type":"string"},
            {"name":"categoryId", "type":"int"},
            {"name":"categoryName", "type":"string"},
            {"name":"price", "type":"float"},
            {"name":"costPrice", "type":"float"},
            {"name":"stock", "type":"int"},
            {"name":"minStock", "type":"int"},
            {"name":"unit", "type":"string"},
            {"name":"supplierId", "type":"int"},
            {"name":"supplierName", "type":"string"},
            {"name":"barcode", "type":"string"},
            {"name":"remark", "type":"string"}
        ]}
    ]
},

{
    "name": "listById",
    "method": "GET",
    "property": "private",
    "tokenChecker": "USER",
    "aclChecker":"RBAC",
    "feature":"admin,purchaser",
    "request": [
        {"name":"ids", "type":"int", "must":true, "list":true, "minSize":1}
    ],
    "process": [
        {
            "name": "get_products",
            "type": "rdb",
            "db": "inventory",
            "sqls": [{
                "name": "list",
                "multi": true,
                "metas": "each",
                "sql": "select p.id,p.name,c.id categoryId,c.name as categoryName,p.price,p.costPrice,p.stock,p.minStock,p.unit,s.id supplierId,s.name as supplierName,p.barcode,p.remark
                  from products p
                  left join categories c on p.category=c.id
                  left join suppliers s on p.supplier=s.id
                  where p.id in(@{LIST|ids,``}) order by p.createAt desc"
            }]
        }
    ],
    "response": [
        {"name":"total", "type":"int"},
        {"name":"list", "type":"object", "list":true, "props":[
            {"name":"id", "type":"int"},
            {"name":"name", "type":"string"},
            {"name":"categoryId", "type":"int"},
            {"name":"categoryName", "type":"string"},
            {"name":"price", "type":"float"},
            {"name":"costPrice", "type":"float"},
            {"name":"stock", "type":"int"},
            {"name":"minStock", "type":"int"},
            {"name":"unit", "type":"string"},
            {"name":"supplierId", "type":"int"},
            {"name":"supplierName", "type":"string"},
            {"name":"barcode", "type":"string"},
            {"name":"remark", "type":"string"}
        ]}
    ]
},

{
    "name": "search",
    "method": "GET",
    "property": "private",
    "tokenChecker": "USER",
    "request": [
        {"name":"keyword", "type":"string", "must":true, "min":1},
        {"name":"categoryId", "type":"int", "must":false},
        {"name":"limit", "type":"int", "must":false, "default":50}
    ],
    "process": [
        {
            "name": "search_ids",
            "type": "search",
            "db": "inventory",
            "table": "products",
            "action": "get @{limit}",
            "content": "@{keyword}"
        },
        {
            "name": "get_products",
            "type": "rdb",
            "db": "inventory",
            "sqls": [{
                "name": "list",
                "multi": true,
                "metas": "each",
                "sql": "select p.id,p.name,c.id categoryId,c.name as categoryName,p.price,p.costPrice,
                    p.stock,p.minStock,p.unit,s.id supplierId,s.name as supplierName,p.barcode,p.remark 
                    from products p
                    left join categories c on p.category=c.id
                    left join suppliers s on p.supplier=s.id
                    where p.id in(@{LIST|!search_ids,``})
                    @{IFVALID|categoryId, ' and p.category=', categoryId}"
            }]
        }
    ],
    "response": [
        {"name":"list", "type":"object", "list":true, "props":[
            {"name":"id", "type":"int"},
            {"name":"name", "type":"string"},
            {"name":"categoryId", "type":"int"},
            {"name":"categoryName", "type":"string"},
            {"name":"price", "type":"float"},
            {"name":"costPrice", "type":"float"},
            {"name":"stock", "type":"int"},
            {"name":"minStock", "type":"int"},
            {"name":"unit", "type":"string"},
            {"name":"supplierId", "type":"int"},
            {"name":"supplierName", "type":"string"},
            {"name":"barcode", "type":"string"},
            {"name":"remark", "type":"string"}
        ]}
    ]
},

{
    "name": "create",
    "method": "POST",
    "property": "private",
    "tokenChecker": "USER",
    "aclChecker":"RBAC",
    "feature": "admin,purchaser",

    "request": [
        {"name":"name", "type":"string", "must":true},
        {"name":"category", "type":"int", "must":true, "comment":"分类id"},
        {"name":"price", "type":"float", "must":true},
        {"name":"costPrice", "type":"float", "must":true},
        {"name":"stock", "type":"int", "must":true},
        {"name":"minStock", "type":"int", "must":false, "default":10},
        {"name":"unit", "type":"string", "must":false, "default":"件"},
        {"name":"supplier", "type":"int", "must":true, "comment":"供应商id"},
        {"name":"barcode", "type":"string", "must":false, "default":""},
        {"name":"remark", "type":"string", "must":false, "default":""}
    ],

    "vars":[
        {"name":"did", "val":"@{SEQUENCE|i,'product'}"}
    ],

    "process": [
        {
            "name": "insert_product",
            "type": "rdb",
            "db": "inventory",
            "sqls": ["insert into products(id,createAt,name,category,price,costPrice,stock,minStock,unit,supplier,barcode,remark)
             values(@{did},@{NOW|unit60000},'@{name}',@{category},@{price},@{costPrice},@{stock},@{minStock},'@{unit}',@{supplier},'@{barcode}','@{remark}')"]
        },
        {
            "name": "create_search_index",
            "type": "search",
            "db": "inventory",
            "action": "put",
            "table": "products",
            "did": "@{did}",
            "title": "@{name}",
            "content": "@{remark} @{barcode}"
        }
    ],
    "response": []
},

{
    "name": "update",
    "method": "PUT",
    "property": "private",
    "tokenChecker": "USER",
    "aclChecker":"RBAC",
    "feature": "admin,purchaser",
    
    "request": [
        {"name":"id", "type":"int", "must":true},
        {"name":"name", "type":"string", "must":true},
        {"name":"category", "type":"int", "must":true},
        {"name":"price", "type":"float", "must":true},
        {"name":"costPrice", "type":"float", "must":true},
        {"name":"minStock", "type":"int", "must":false, "default":10},
        {"name":"unit", "type":"string", "must":false, "default":"件"},
        {"name":"supplier", "type":"int", "must":true},
        {"name":"barcode", "type":"string", "must":false, "default":""},
        {"name":"remark", "type":"string", "must":false, "default":""}
    ],
    "process": [
        {
            "name": "update_product",
            "type": "rdb",
            "db": "inventory",
            "sqls": ["update products set name='@{name}',
                category=@{category},price=@{price},costPrice=@{costPrice},minStock=@{minStock},unit='@{unit}',supplier=@{supplier},barcode='@{barcode}',remark='@{remark}'
                where id=@{id}"]
        },
        {
            "name": "search_update",
            "type": "search",
            "db": "inventory",
            "action": "update",
            "table": "products",
            "did": "@{id}",
            "title": "@{name}",
            "content": "@{remark} @{barcode}"
        }
    ],
    "response": []
},

{
    "name": "delete",
    "method": "DELETE",
    "property": "private",
    "tokenChecker": "USER",
    "aclChecker":"RBAC",
    "feature": "admin",

    "request": [
        {"name":"id", "type":"int", "must":true}
    ],

    "process": [
        {
            "name": "delete_product",
            "type": "rdb",
            "db": "inventory",
            "sqls": ["delete from products where id=@{id}"]
        },
        {
            "name": "delete_search_index",
            "type": "search",
            "db": "inventory",
            "action": "rmv",
            "table": "products",
            "did": "@{id}"
        }
    ],
    "response": []
},

{
    "name": "get",
    "method": "GET",
    "property": "private",
    "tokenChecker": "USER",

    "request": [
        {"name":"id", "type":"int", "must":true}
    ],

    "process": [{
        "name": "query",
        "type": "rdb",
        "db": "inventory",
        "sqls": [{
            "name": "product",
            "multi": false,
            "merge": true,
            "metas": "each",
            "sql": "select p.id,p.name,c.name as categoryName,p.price,p.costPrice,p.stock,p.minStock,p.unit,s.name as supplierName,p.barcode,p.remark
                from products p
                left join categories c on p.category=c.id
                left join suppliers s on p.supplier=s.id
                where p.id=@{id}"
        }]
    }],
    "response": [
        {"name":"id", "type":"int"},
        {"name":"name", "type":"string"},
        {"name":"categoryName", "type":"string"},
        {"name":"price", "type":"float"},
        {"name":"costPrice", "type":"float"},
        {"name":"stock", "type":"int"},
        {"name":"minStock", "type":"int"},
        {"name":"unit", "type":"string"},
        {"name":"supplierName", "type":"string"},
        {"name":"barcode", "type":"string"},
        {"name":"remark", "type":"string"}
    ]
},

{
    "name": "adjustStock",
    "method": "POST",
    "property": "private",
    "tokenChecker": "USER",
    "aclChecker":"RBAC",
    "feature": "admin",
    "comment": "盘点/库存调整：直接将库存调整为指定数量，并记录流水",
    "request": [
        {"name":"productId", "type":"int", "must":true},
        {"name":"newStock", "type":"int", "must":true, "min":0, "comment":"调整后的实际库存"},
        {"name":"remark", "type":"string", "must":false, "default":""}
    ],

    "vars":[
        {"name":"adjId", "val":"@{SEQUENCE|i,'stockop'}"}
    ],

    "process": [
        {
            "name": "adjust_stock",
            "type": "rdb",
            "db": "inventory",
            "sqls": [
                //先记流水（before=当前库存, after=newStock, delta=newStock-当前库存），再更新库存
                "insert or ignore into stock_ops(orderId,productId,type,createAt,delta,before,after,productName,creator,remark)
                 select @{adjId},@{productId},'ADJ',@{NOW},@{newStock}-stock,stock,@{newStock},name,'@{#tokenAcc}','@{remark}'
                 from products where id=@{productId}",
                "update products set stock=@{newStock} where id=@{productId}"
            ]
        }
    ],
    "response": []
},

{
    "name": "stockOps",
    "method": "GET",
    "property": "private",
    "tokenChecker": "USER",
    "comment": "查询商品的库存流水",
    "request": [
        {"name":"productId", "type":"int", "must":true},
        {"name":"page", "type":"int", "must":false, "default":1},
        {"name":"pageSize", "type":"int", "must":false, "default":20}
    ],
    "process": [
        {
            "name": "get_ops",
            "type": "rdb",
            "db": "inventory",
            "sqls": [
                {
                    "name": "total",
                    "multi": false,
                    "merge": true,
                    "metas": "each",
                    "sql": "select count(*) as total from stock_ops where productId=@{productId}"
                },
                {
                    "name": "list",
                    "multi": true,
                    "metas": "each",
                    "sql": "select orderId,type,delta,before,after,createAt,creator,remark
                        from stock_ops where productId=@{productId}
                        order by createAt desc
                        limit @{pageSize} offset @{CALCULATE|i,(page-1)*pageSize}"
                }
            ]
        }
    ],
    "response": [
        {"name":"total", "type":"int"},
        {"name":"list", "type":"object", "list":true, "props":[
            {"name":"orderId", "type":"int"},
            {"name":"type", "type":"string"},
            {"name":"delta", "type":"int"},
            {"name":"before", "type":"int"},
            {"name":"after", "type":"int"},
            {"name":"createAt", "type":"long"},
            {"name":"creator", "type":"string"},
            {"name":"remark", "type":"string"}
        ]}
    ]
}
]
