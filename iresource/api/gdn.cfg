[
{
    "name": "listByFac",
    "method":"GET",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"ABAC",
    "comment":"按工厂查询出库单",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID"},
        {"name":"state", "type":"string", "must":false, "default":"WAIT", "options":["WAIT","CHK","OVER"], "comment":"状态"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"偏移"},
        {"name":"num", "type":"int", "must":false, "min":1, "default":10, "comment":"返回行数"}
    ],

    "aclProcess":[
        {"macro":"judge_factory_right", "#FACTORY#":"@{factory}", "#TYPE#":"'O'"}
    ],
    
    "process" : [
        {
            "name" : "list_gdn",
            "type" : "rdb",
            "db": "log",
            "sharding":"@{NOW|`yyyy`}",
            "sqls" : [
                {
                    "name" : "list",
                    "metas" : "each",
                    "multi" : true,
                    "merge" : false,
                    "sql":"select id,purId,state,type,tranNo,applicant,applyCmt,outDate,cfmDate
                            from gdn where factory=@{factory} and state='@{state}'
                         order by outDate desc
                         LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name" : "get_total",
                    "metas" : "each",
                    "multi" : false,
                    "merge" : true,
                    "sql":"select count(*) total from gdn
                         where factory=@{factory} and state='@{state}'"
                }
            ]
        },
        {
            "name" : "list_purchase",
            "type" : "rdb",
            "db": "purchase",
            "sqls" : [{
                "name" : "purs",
                "metas" : "kv",
                "multi" : true,
                "merge" : false,
                "sql" : "select id,prjName,applicant
                     from purchase where id in(@{LIST|!list.purId,''})"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "props":[
                {"name":"id", "type":"int", "comment":"工厂id，seqid"},
                {"name":"purId", "type":"int", "comment":"采购申请单ID"},
                {"name":"state", "type":"string", "comment":"状态"},
                {"name":"type", "type":"string", "comment":"INN向内发货，EXT向外发货"},
                {"name":"tranNo", "type":"string", "comment":"外部或内部运单号"},
                {"name":"applicant", "type":"string", "comment":"申请人帐号，比如其他仓库的管理员，或项目经理"},
                {"name":"applyCmt", "type":"string", "comment":"申请人备注信息"},
                {"name":"outDate", "type":"int", "comment":"实际发货日期，UTC分钟"},
                {"name":"cfmDate", "type":"int", "comment":"确认收货日期，UTC分钟"}
            ]},
            {"name":"total", "type":"int", "comment":"总数"},
            {"name":"purs", "type":"object", "list":true, "props":[
                {"name":"id", "type":"int", "comment":"ID"},
                {"name":"prjName", "type":"string", "comment":"项目名称，冗余，与project服务不一定一致"},
                {"name":"applicant", "type":"string", "comment":"申请人帐号，通常是项目经理"}
            ]}
        ]
    }
},

{
    "name": "get",
    "method":"GET",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"RBAC",
    "comment":"按采购单查询出库单，提货时查询。
        按年度分库，分库的状态影响查询结果，尽量将最近几年的放在同一个库中",

    "request": [
        {"name":"id", "type":"int", "must":true, "min":0, "comment":"发货单id"}
    ],

    "process" : [
        {
            "name" : "get_gdn_detail",
            "type" : "rdb",
            "db": "log",
            "sharding":"@{NOW|`yyyy`}",
            "sqls" : [{
                "name" : "detail",
                "metas" : "each",
                "multi" : false,
                "merge" : true,
                "sql":"select purId,state,type,state,tranNo,applicant,receiver,
                    applyCmt,outDate,cfmDate,execAcc,cmt,factory
                     from gdn where id=@{id}"
            }]
        },
        {
            "name" : "get_purchase",
            "type" : "rdb",
            "db": "purchase",
            "sqls" : [{
                "name" : "purchase",
                "metas" : "each",
                "multi" : false,
                "merge" : true,
                "sql" : "select prjName,applicant
                     from purchase where id=@{!purId}"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"purId", "type":"int", "comment":"采购申请单ID"},
            {"name":"state", "type":"string", "comment":"状态"},
            {"name":"type", "type":"string", "comment":"INN向内发货，EXT向外发货"},
            {"name":"tranNo", "type":"string", "comment":"外部或内部运单号"},
            {"name":"applicant", "type":"string", "comment":"申请人帐号，通常是项目经理"},
            {"name":"receiver", "type":"string", "comment":"收件人，包括姓名、电话、地址，内部发货为接收人帐号"},
            {"name":"applyCmt", "type":"string", "comment":"申请人备注信息"},
            {"name":"outDate", "type":"int", "comment":"实际发货日期，UTC分钟"},
            {"name":"cfmDate", "type":"int", "comment":"确认收货日期，UTC分钟"},
            {"name":"execAcc", "type":"string", "comment":"出库执行人帐号"},
            {"name":"cmt", "type":"string", "comment":"仓库管理员备注信息"},
            {"name":"factory", "type":"int", "comment":"发货工厂ID"},
            {"name":"prjName", "type":"string", "comment":"项目名称，冗余，与project服务不一定一致"}
        ]
    }
},
{
    "name": "start",
    "method":"POST",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"ABAC",
    "comment":"开始执行资源出库，设置运单号与备注，在执行shipOut之前调用",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID，用于分库"},
        {"name":"purId", "type":"int", "must":true, "min":0, "comment":"采购申请id"},
        {"name":"tranNo", "type":"string", "must":true, "min":0, "comment":"运单号，如有多个，填一个即可"},
        {"name":"cmt", "type":"string", "must":false, "default":"", "comment":"描述"}
    ],
    
    "aclProcess":[
        {"macro":"judge_factory_right", "#FACTORY#":"@{factory}", "#TYPE#":"'O'"}
    ],
    
    "process" : [
        {
            "name" : "get_purchase",
            "type":"rdb",
            "db":"purchase",
            "sqls":[{
                "name" : "purchase",
                "metas" : "each",
                "multi" : false,
                "merge" : true,
                "sql" : "select type,applicant,receiver,descr from
                     purchase where id=@{purId}"
            }]
        },
        {
            "name" : "generate_gdn_id",
            "type" : "var",
            "vars":[
                {"name":"id", "val":"@{SEQUENCE|i,gdnid}", "toResp":true, "comment":"发货id"}
            ]            
        },
        {
            "name" : "save_gdn",
            "type" : "rdb",
            "db": "log",
            "sharding":"@{NOW|yyyy}",
            "sqls" : [
                 "insert into gdn(id,purId,factory,receiver,tranNo,
                    execAcc,applicant,applyCmt,outDate,cmt,type) values
                  (@{id},@{purId},@{factory},'@{!receiver}','@{tranNo}',
                  '@{#tokenAcc}','@{!applicant}','@{!descr}',@{NOW|unit60000},'@{cmt}',
                  '@{CONDITION|!type,`s.==`,`SELL`,`EXT`,`INN`}')"
             ]
        }
    ],
    "response": [
        {"name":"id", "type":"int", "must":true}
    ]
},
{
    "name": "update",
    "method":"PUT",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"ABAC",
    "comment":"修改出库单信息",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID"},
        {"name":"id", "type":"int", "must":true, "min":0, "comment":"出库ID"},
        {"name":"tranNo", "type":"string", "must":true, "min":0, "comment":"运单号，如有多个，填一个即可"},
        {"name":"receiver", "type":"string", "must":true, "min":0, "comment":"收货人联系方式"},
        {"name":"cmt", "type":"string", "must":false, "default":"", "comment":"描述"}
    ],

    "aclProcess":[
        {"macro":"judge_factory_right", "#FACTORY#":"@{factory}", "#TYPE#":"'O'"}
    ],

    "process" : [
        {
            "name" : "update_gdn",
            "type" : "rdb",
            "db": "log",
            "sharding":"@{NOW|`yyyy`}",
            "sqls" : [
                "update gdn set 
                  tranNo='@{tranNo}',
                  receiver='@{receiver}',
                  cmt='@{cmt}'
                 where id=@{id} and factory=@{factory}"
            ]
        }
    ]
},
{
    "name": "remove",
    "method":"DELETE",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"ABAC",
    "comment":"删除出库单",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID"},
        {"name":"id", "type":"int", "must":true, "min":0, "comment":"出库ID"}
    ],

    "aclProcess":[
        {"macro":"judge_factory_right", "#FACTORY#":"@{factory}", "#TYPE#":"'O'"},
        {
            "name" : "judge_gdn_list",
            "type" : "dataexists",
            "db": "log",
            "sharding":"@{NOW|`yyyy`}",
            
            //删除gdnlist时需要将shiplist还回inventory、将resource置为idle
            //resource使用no分库，shiplist为多个，无法实现分库
            //所以删除发货记录前，需要先逐个调用removeSku将shiplist清空
            
            "expect":false, 
            "errorCode":12003,
            "errorInfo":"gdn not empty",
            "sql" : "select 1 from gdnlist where gdnId=@{id}"
        }
    ],

    "process" : [{
        "name" : "remove_gdn",
        "type" : "rdb",
        "db": "log",
        "sharding":"@{NOW|`yyyy`}",
        "sqls" : [
            "delete from gdn where id=@{id}
             and factory=@{factory} and state in('WAIT','CHK')"
        ]
    }]
},
{
    "name": "shipOut",
    "method":"POST",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"ABAC",
    "comment":"执行资源出库",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID，用于分库"},
        {"name":"gdnId", "type":"int", "must":true, "min":0, "comment":"发货ID"},
        {"name":"num", "type":"int", "must":true, "min":1, "comment":"出库数量"},
        {"name":"no", "type":"string", "must":true, "min":1, "comment":"资产编号"}
    ],

    "aclProcess":[
        {"macro":"judge_factory_right", "#FACTORY#":"@{factory}", "#TYPE#":"'O'"}
    ],

    "process" : [
        {
            "name" : "get_resource_sku",
            "type" : "rdb",
            "db": "inventory",
            "sharding":"@{factory}",
            "convert":{"code":"NOT_EXISTS", "to":6009, "info":"resource not enough"},
            "sqls" : [{
                "name" : "get_sku",
                "metas" : "each",
                "multi" : false,
                "merge" : true,
                "sql":"select sku,num,skuType,skuName,price from inventory
                 where no='@{no}' and num>=@{num}"
            }]
        },
        {
            "name" : "save_gdnlist",
            "type" : "rdb",
            "db": "log",
            "sharding":"@{NOW|yyyy}",
            "sqls" : [
                "update gdn set state='CHK' where id=@{gdnId}",
                "insert into gdnlist(gdnId,no,sku,price,skuType,skuName,num)
                 values(@{gdnId},'@{no}',@{!sku},@{!price},'@{!skuType}','@{!skuName}',@{num})"
            ]
        },
        {
            "name" : "record_shiplist",
            "type" : "rdb",
            "db": "inventory",
            "sharding":"@{factory}",
            "when":"@{CONDITION|num,'i.==',!num}",
            "sqls" : [
                "insert into shiplist(gdnId,factory,price,inDate,checkAt,no,tranNo,cmt)
                 select @{gdnId},factory,price,inDate,checkAt,no,tranNo,cmt
                   from inventory where no='@{no}'",
                "delete from inventory where no='@{no}'"
            ]
        },
        {
            "name" : "update_inventory",
            "type" : "rdb",
            "db": "inventory",
            "sharding":"@{factory}",
            "when":"@{CONDITION|num,'i.<',!num}",
            "sqls" : [
                "update inventory set num=num-@{num} where no='@{no}'"
            ]
        },
        {
            //因为按no分库，finish中无法批量处理，所以放在此处保存
            //remove gdnlist时，需要一并改变
            "name" : "update_resource_state",
            "type" : "rdb",
            "db": "resource",
            "when":"@{CONDITION|num,'i.==',!num}",
            "sharding" : "@{ABSHASH|no}",
            "sqls" : [
                "update resource set state='NONE' where no='@{no}'"
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"sku", "type":"int", "comment":"SKU id"},
            {"name":"num", "type":"int", "comment":"数量，小件SKU大于1，其他为1"},
            {"name":"skuType", "type":"string", "comment":"类型，与财务报表中资产类型保持一致"},
            {"name":"skuName", "type":"string", "comment":"冗余，方便查询"},
            {"name":"price", "type":"double", "comment":"采购价格"}
        ]
    }
},
{
    "name": "finish",
    "method":"POST",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"ABAC",
    "comment":"完成资源出库，状态改成'运输中'",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID，用于分库"},
        {"name":"id", "type":"int", "must":true, "min":0, "comment":"发货ID"}
    ],

    "aclProcess":[
        {"macro":"judge_factory_right", "#FACTORY#":"@{factory}", "#TYPE#":"'O'"}
    ],

    "process" : [
        {
            "name" : "save_gdnlist",
            "type" : "rdb",
            "db": "log",
            "sharding":"@{NOW|yyyy}",
            "sqls" : [
                "update gdn set
                    outDate=@{NOW|unit60000},
                    state='TRAN' -- 运输中
                  where id=@{id} and state='CHK'"
            ]
        },
        {
            "name" : "clear_shiplist",
            "type" : "rdb",
            "db": "inventory",
            "sharding":"@{factory}",
            "sqls" : [//gdnlist不会再改变，所以inventory历史数据没有必要存在
                "delete from shiplist where gdnId=@{id}"
            ]
        }
    ]
},
{
    "name": "setState",
    "method":"PUT",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"ABAC",
    "comment":"向外发货，当发货出现异常情况时，由发货执行人设置发货的状态",

    "aclProcess":[
        {"macro":"judge_factory_right", "#FACTORY#":"@{factory}", "#TYPE#":"'O'"}
    ],

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID，用于分库"},
        {"name":"gdnId", "type":"int", "must":true, "min":0, "comment":"发货ID"},
        {"name":"at", "type":"int", "must":true, "min":0, "comment":"确认时间"},
        {"name":"state", "type":"string", "must":true, "options":["LOST","BACK"], "comment":"发货状态"}
    ],

    "process" : [
        {
            "name" : "set_gdn_state",
            "type" : "rdb",
            "db": "log",
            "sharding":"@{NOW|yyyy}",
            "sqls" : [
                "update gdn set
                   state='@{state}',
                   cfmDate=@{at}
                 where id=@{gdnId} and execAcc='@{#tokenAcc}'"
            ]
        }
    ]
},
{
    "name": "gdnlist",
    "method":"GET",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"RBAC",
    "comment":"出库sku列表",

    "request": [
        {"name":"gdnId", "type":"int", "must":true, "min":0, "comment":"发货ID"}
    ],

    "process" : [
        {
            "name" : "get_gdnlist",
            "type":"rdb",
            "db":"log",
            "sharding":"@{NOW|`yyyy`}",
            "sqls":[{
                "name" : "list",
                "metas" : "each",
                "multi" : true,
                "merge" : false,
                "sql" : "select sku,num,skuName,no from gdnlist where gdnId=@{gdnId}"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "props":[
                {"name":"sku", "type":"int", "comment":"SKU id"},
                {"name":"num", "type":"int", "comment":"数量，小件SKU大于1，其他为1"},
                {"name":"skuName", "type":"string", "comment":"sku名称"},
                {"name":"no", "type":"string", "comment":"资产编号"}
            ]}
        ]
    }
},
{
    "name": "removeSku",
    "method":"DELETE",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"ABAC",
    "comment":"删除资源出库列表中的条目",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID，用于分库"},
        {"name":"gdnId", "type":"int", "must":true, "min":0, "comment":"发货ID"},
        {"name":"no", "type":"string", "must":true, "min":1, "comment":"资产编号"}
    ],

    "aclProcess":[
        {"macro":"judge_factory_right", "#FACTORY#":"@{factory}", "#TYPE#":"'O'"},
        {
            "name" : "judge_gdn",
            "type":"dataexists",
            "db":"log",
            "sharding":"@{NOW|'yyyy'}",
            "expect" : true,
            "errorCode":6008,
            "errorInfo":"invalid gdn state",
            "sql":"select 1 from gdn where id=@{gdnId} and state in('WAIT','CHK')"
        }
    ],
    
    "process" : [
        {
            "name" : "rmv_gdnlist",
            "type" : "rdb",
            "db": "log",
            "sharding":"@{NOW|'yyyy'}",
            "sqls" : [
                {
                    "name" : "get_res_info",
                    "metas" : "each",
                    "multi" : false,
                    "merge" : true,
                    "sql" : "select sku,num,skuName,skuType from gdnlist
                     where gdnId=@{gdnId} and no='@{no}'"
                },
                "delete from gdnlist where gdnId=@{gdnId} and no='@{no}'"
            ]
        },
        {
            "name" : "restore_inventory",
            "type" : "rdb",
            "db": "inventory",
            "sharding" : "@{factory}",
            "sqls" : [
                //恢复被删除的数据，如存在(零件未用完的情况)，则忽略
                "insert or ignore into inventory(factory,sku,num,price,
                    inDate,checkAt,no,tranNo,skuName,skuType,cmt)
                 select factory,@{!sku},0,price,
                    inDate,checkAt,no,tranNo,'@{!skuName}','@{!skuType}',cmt
                  from shiplist where gdnId=@{gdnId} and no='@{no}'",

                //将扣除的数量重新加上去
                "update inventory set num=num+@{!num} where no='@{no}'",
                "delete from shiplist where gdnId=@{gdnId} and no='@{no}'"
            ]
        },
        {
            "name" : "update_resource_state",
            "type" : "rdb",
            "db": "resource",
            "sharding" : "@{ABSHASH|no}",
            "sqls" : [
                "update resource set state='IDLE' where no='@{no}'"
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"sku", "type":"int", "comment":"SKU id"},
            {"name":"num", "type":"int", "comment":"数量，小件SKU大于1，其他为1"},
            {"name":"skuName", "type":"string", "comment":"sku名称"},
            {"name":"skuType", "type":"string", "comment":"冗余，为了便于统计不同类型的成本"}
        ]
    }
},
{
    "name": "dir_out",
    "method":"POST",
    "property" : "private",
    "tokenChecker" : "USER",
    "aclChecker" : "ABAC",
    "comment":"直接出库，比如内部生产的产品出库到其他工厂。如果出现监守自盗的情况，会造成损失。
        清点资产时，如果发现资产对不上，需要手动查询outlog进行追查",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID"},
        {"name":"pid", "type":"int", "must":true, "min":1, "comment":"接收方项目ID"},
        {"name":"no", "type":"string", "must":true, "min":1, "comment":"资产编号"},
        {"name":"num", "type":"int", "must":true, "min":1, "comment":"数量"},
        {"name":"cmt", "type":"string", "must":true, "min":0, "comment":"报废原因"}
    ],

    "aclProcess":[
        {"macro":"judge_factory_right", "#FACTORY#":"@{factory}", "#TYPE#":"'O'"}
    ],

    "process" : [
        {
            "name" : "get_inventory",
            "type" : "rdb",
            "db": "inventory",
            "sharding":"@{factory}",
            "sqls" : [{
                "name" : "inventory",
                "metas" : "each",
                "multi" : false,
                "merge" : true,
                "sql":"select num,sku,skuType,skuName,price from inventory where no='@{no}'"
            }],
            "onSuccess":{
                "condition":"@{CONDITION|!num,'i.>=',num}",
                "errorCode":"6009",
                "errorInfo":"no more resource"
            }
        },
        {
            "name" : "update_inventory",
            "type" : "rdb",
            "db": "inventory",
            "sharding":"@{factory}",
            "sqls" : [
                {
                    "when":"@{CONDITION|num,'i.==',!num}",
                    "sql":"delete from inventory where no='@{no}'"
                },
                {
                    "when":"@{CONDITION|num,'i.<=',!num}",
                    "sql":"update inventory set num=num-@{num}
                         where no='@{no}' and num>=@{num}"
                }
            ]
        },
        {
            "name" : "save_out_log",
            "type" : "rdb",
            "db": "log",
            "sharding":"@{NOW|yyyy}",
            "sqls" : [
                "replace into outlog(no,factory,num,sku,skuName,type,execAcc,cmt)
                 values('@{no}',@{factory},@{num},@{!sku},'@{!skuName}',
                 'OUT','@{#tokenAcc}','@{cmt}')"
            ]
        },
        {
            "name" : "clear_resource",
