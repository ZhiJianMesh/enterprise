[
{
    "name": "listBySku",
    "method":"GET",
    "property" : "private",
    "tokenChecker":"USER",
    "aclChecker":"RBAC",
    "feature":"whadmin",
    "comment":"查询指定sku",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID，用于分库"},
        {"name":"sku", "type":"int", "must":true, "min":0, "comment":"sku ID"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"偏移"},
        {"name":"num", "type":"int", "must":false, "min":1, "default":10, "comment":"返回行数"}
    ],

    "process" : [
        {
            "name" : "get_sku_headNo",
            "type" : "rdb",
            "db": "common",
            "sqls" : [{
                "name": "get_headNo",
                "metas": "each",
                "multi": false,
                "merge": true,
                "sql":"select noHead from sku where id=@{sku}"
            }]
        },
        {
            "name" : "list_resources",
            "type" : "rdb",
            "db": "inventory",
            "sharding":"@{factory}",
            "sqls" : [{
                "name" : "list",
                "metas" : "each",
                "multi" : true,
                "merge" : false,
                "sql":"select no,inDate,num,price,sku,skuName,factory
                     from inventory
                    where factory=@{factory}
                      and no like '@{!noHead}%'
                     order by inDate desc
                     LIMIT @{num} OFFSET @{offset}"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"noHead", "type":"string", "comment":"资产编号的头部"},
            {"name":"list", "type":"object", "list":true, "props":[
                {"name":"no", "type":"string", "comment":"资产编号"},
                {"name":"inDate", "type":"int", "comment":"入库时间，UTC分钟"},
                {"name":"num", "type":"int", "comment":"数量，小件SKU大于1，其他为1"},
                {"name":"price", "type":"double", "comment":"采购价格"},
                {"name":"sku", "type":"int", "comment":"SKU id"},
                {"name":"skuName", "type":"string", "comment":"冗余，方便查询"},
                {"name":"factory", "type":"int", "comment":"工厂ID"}
            ]}
        ]
    }
},
{
    "name": "listByFac",
    "method":"GET",
    "property" : "private",
    "tokenChecker":"USER",
    "comment":"按工厂查询资产",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID"},
        {"name":"offset", "type":"int", "must":false, "min":0, "default":0, "comment":"偏移"},
        {"name":"num", "type":"int", "must":false, "min":1, "default":10, "comment":"返回行数"},
        {"name":"order", "type":"string", "must":false, "default":"", "options":["desc","asc",""], "comment":"顺序"}
    ],

    "process" : [
        {
            "name" : "list_resource",
            "type" : "rdb",
            "db": "inventory",
            "sharding":"@{factory}",
            "sqls" : [
                {
                    "name" : "list",
                    "metas" : "each",
                    "multi" : true,
                    "merge" : false,
                    "sql":"select no,inDate,num,price,sku,skuName,checkAt from inventory
                         where factory=@{factory}
                         @{CONDITION|order,'s.==', '', ` and checkAt>0 order by no desc`, ` order by checkAt @{order}`}
                         LIMIT @{num} OFFSET @{offset}"
                },
                {
                    "name" : "get_total",
                    "metas" : "each",
                    "multi" : false,
                    "merge" : true,
                    "sql":"select count(*) total from inventory
                         where factory=@{factory}"
                }
            ]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "props":[
                {"name":"no", "type":"string", "comment":"资产编号"},
                {"name":"inDate", "type":"int", "comment":"入库时间，UTC分钟"},
                {"name":"num", "type":"int", "comment":"数量，小件SKU大于1，其他为1"},
                {"name":"price", "type":"double", "comment":"采购价格"},
                {"name":"sku", "type":"int", "comment":"SKU id"},
                {"name":"skuName", "type":"string", "comment":"冗余，方便查询"},
                {"name":"checkAt", "type":"int", "comment":"清点时间，UTC分钟"}
            ]},
            {"name":"total", "type":"int", "comment":"总数"}
        ]
    }
},
{
    "name": "search",
    "method":"GET",
    "property" : "private",
    "tokenChecker":"USER",
    "comment":"按资产编号的前缀查询资源的信息",

    "request": [
        {"name":"factory", "type":"int", "must":true, "min":0, "comment":"工厂ID"},
        {"name":"no", "type":"string", "must":true, "min":1, "regular":"^[^%?]+$", "comment":"资产编号"},
        {"name":"limit", "type":"int", "must":true, "min":1, "comment":"返回最大行数"}
    ],

    "process" : [
        {
            "name" : "get_inventory",
            "type" : "rdb",
            "db": "inventory",
            "sharding":"@{factory}",
            "sqls" : [{
                "name": "list",
                "metas": "each",
                "multi": true,
                "merge": false,
                "sql":"select no,sku,skuName,num,price,inDate
                     from inventory
                    where factory=@{factory} and no like '@{no}%'
                    order by inDate asc
                    LIMIT @{limit}"
            }]
        }
    ],
    "response":{
        "check":false,
        "segments":[
            {"name":"list", "type":"object", "list":true, "props":[
                {"name":"no", "type":"string", "comment":"资产编号"},
                {"name":"sku", "type":"int", "comment":"SKU id"},
                {"name":"skuName", "type":"string", "comment":"冗余，方便查询"},
                {"name":"num", "type":"int", "comment":"数量，小件SKU大于1，其他为1"},
                {"name":"price", "type":"double", "comment":"采购价格"},
                {"name":"inDate", "type":"int", "comment":"入库时间，UTC分钟"}
            ]}
        ]
    }
},
{
    "name": "getInFactory",
    "method":"GET",
    "property" : "private",
    "tokenChecker":"USER",
    "comment":"在指定工厂中查询资源的信息",

